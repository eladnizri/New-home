<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECECF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15121A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הבית החדש">
<title>הבית החדש</title>

<style>
/* ============================================================
   TOKENS
   Two colour tiers. The pastel tier paints large labelled
   surfaces (tiles, blobs, fills). The data tier is a deepened
   version of the same hues, used wherever colour actually
   encodes something — status dots, rings, chart marks — and is
   validated for colourblind separation. They are never swapped.
   ============================================================ */
:root{
  direction: rtl;

  --bg:        #ECECF3;
  --bg-2:      #F4F4F9;
  --card:      #FFFFFF;
  --card-2:    #F6F6FA;
  --card-3:    #EDEDF4;
  --line:      #E3E2EE;
  --line-2:    #CFCDDE;
  --ink:       #2E2A33;
  --ink-2:     #5C5665;
  --muted:     #767085;

  /* data tier — validated, light surface */
  --d-home:    #96517A;
  --d-buy:     #C4762B;
  --d-done:    #12866E;
  --d-alert:   #C0453C;

  /* pastel tier — surfaces only, always carry a text label */
  --t-home:    #9E7C8C;
  --t-buy:     #E3A276;
  --t-done:    #A3C68B;
  --t-alert:   #E28787;
  --t-ink:     #FFFFFF;

  --brand:     #8D5C77;
  --brand-ink: #FFFFFF;

  --sh-sm: 0 2px 6px rgba(46,42,51,.05);
  --sh:    0 6px 18px rgba(46,42,51,.07), 0 1px 3px rgba(46,42,51,.04);
  --sh-lg: 0 -10px 40px rgba(46,42,51,.16);
  --sh-fab: 0 8px 20px rgba(141,92,119,.38);

  --ui: "Assistant","Heebo","Rubik","Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;

  --r-card: 22px;
  --r-tile: 20px;
  --r-sm:   14px;
  --r-pill: 999px;
  --appw:   470px;
  --navh:   72px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:      #15121A;
    --bg-2:    #1B1721;
    --card:    #221D2A;
    --card-2:  #29222F;
    --card-3:  #322A39;
    --line:    #322A3B;
    --line-2:  #443A4F;
    --ink:     #F1ECF5;
    --ink-2:   #C4BBCE;
    --muted:   #8C8398;

    --d-home:  #C56AA6;
    --d-buy:   #C9781F;
    --d-done:  #0EA083;
    --d-alert: #E0776B;

    --t-home:  #5E4557;
    --t-buy:   #6E4B2C;
    --t-done:  #3C5B41;
    --t-alert: #6B3B3B;
    --t-ink:   #F6EFF3;

    --brand:   #A9718E;
    --brand-ink: #21181E;

    --sh-sm: 0 2px 6px rgba(0,0,0,.4);
    --sh:    0 6px 18px rgba(0,0,0,.45);
    --sh-lg: 0 -10px 40px rgba(0,0,0,.6);
    --sh-fab: 0 8px 20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:      #15121A;
  --bg-2:    #1B1721;
  --card:    #221D2A;
  --card-2:  #29222F;
  --card-3:  #322A39;
  --line:    #322A3B;
  --line-2:  #443A4F;
  --ink:     #F1ECF5;
  --ink-2:   #C4BBCE;
  --muted:   #8C8398;

  --d-home:  #C56AA6;
  --d-buy:   #C9781F;
  --d-done:  #0EA083;
  --d-alert: #E0776B;

  --t-home:  #5E4557;
  --t-buy:   #6E4B2C;
  --t-done:  #3C5B41;
  --t-alert: #6B3B3B;
  --t-ink:   #F6EFF3;

  --brand:   #A9718E;
  --brand-ink: #21181E;

  --sh-sm: 0 2px 6px rgba(0,0,0,.4);
  --sh:    0 6px 18px rgba(0,0,0,.45);
  --sh-lg: 0 -10px 40px rgba(0,0,0,.6);
  --sh-fab: 0 8px 20px rgba(0,0,0,.5);
}

/* ============================================================ */
*{ box-sizing:border-box; }
body{
  margin:0; background: var(--bg); color: var(--ink);
  font-family: var(--ui); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:-.02em; text-wrap:balance; }
button{ font:inherit; color:inherit; cursor:pointer; border:0; background:transparent; }
input,select{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:6px; }
.n{ font-variant-numeric: tabular-nums; }

.app{
  max-width: var(--appw); margin:0 auto; min-height:100vh; min-height:100dvh;
  background: var(--bg); position:relative;
  padding: 0 16px calc(var(--navh) + 26px + env(safe-area-inset-bottom));
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
}
@media (min-width: 900px){
  body{ background:
    radial-gradient(1100px 620px at 78% -12%, color-mix(in srgb, var(--t-home) 16%, transparent), transparent 62%),
    var(--bg); }
  .app{ box-shadow: 0 0 0 1px var(--line), 0 30px 90px rgba(46,42,51,.10); background: var(--bg-2); }
}

/* ---------- header ---------- */
.apphead{ padding: 18px 0 10px; position:sticky; top:0; z-index:30; background: var(--bg); }
@media (min-width:900px){ .apphead{ background: var(--bg-2); } }
.ah-top{ display:flex; align-items:center; gap:10px; }
.ah-date{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); margin-inline-end:auto; }
.ah-btn{
  width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  background: var(--card); box-shadow: var(--sh-sm); color: var(--ink-2);
}
.ah-btn:hover{ color: var(--ink); }
.ah-title{ margin-top:10px; display:flex; align-items:flex-end; gap:10px; }
.ah-title h1{ font-size:29px; line-height:1.1; }
.ah-title .sub{ font-size:12.5px; color:var(--muted); padding-bottom:5px; margin-inline-start:auto; text-align:end; }

/* ---------- tiles ---------- */
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:13px; margin:18px 0 6px; }
.tile{
  position:relative; overflow:hidden; border-radius: var(--r-tile);
  padding:15px 16px 16px; min-height:104px; color: var(--t-ink);
  display:flex; flex-direction:column; justify-content:space-between; text-align:start;
  box-shadow: var(--sh-sm);
}
.tile .blob{
  position:absolute; border-radius:50%; background: rgba(255,255,255,.19); pointer-events:none;
}
.tile .blob.a{ width:86px; height:86px; top:-34px; inset-inline-start:-24px; }
.tile .blob.b{ width:52px; height:52px; bottom:-22px; inset-inline-end:24px; background: rgba(255,255,255,.13); }
.tile .ic{ position:absolute; top:14px; inset-inline-end:14px; opacity:.9; }
.tile .tv{ font-size:26px; font-weight:700; letter-spacing:-.03em; position:relative; }
.tile .tl{ font-size:13px; font-weight:600; opacity:.95; position:relative; }
.tile .tn{ font-size:11.5px; opacity:.8; position:relative; margin-top:1px; }
.tile.home{ background: var(--t-home); }
.tile.buy{  background: var(--t-buy); }
.tile.done{ background: var(--t-done); }
.tile.alert{ background: var(--t-alert); }
:root[data-theme="dark"] .tile, :root:not([data-theme="light"]) .tile{ box-shadow:none; }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .tile{ box-shadow: var(--sh-sm); } }

/* ---------- generic card ---------- */
.card{
  background: var(--card); border-radius: var(--r-card); box-shadow: var(--sh);
  padding:16px; margin-bottom:14px;
}
.card-h{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.card-h h3{ font-size:15.5px; }
.card-h .side{ margin-inline-start:auto; font-size:12px; color:var(--muted); }
.lede{ font-size:12.5px; color:var(--muted); margin:-4px 0 12px; }

/* ---------- pill tabs ---------- */
.pills{
  display:flex; gap:4px; background: var(--card); border-radius: var(--r-pill);
  padding:5px; box-shadow: var(--sh-sm); margin: 4px 0 16px;
}
.pills button{
  flex:1; border-radius: var(--r-pill); padding:9px 6px; font-size:13px; font-weight:600;
  color: var(--muted); transition: background .16s, color .16s;
}
.pills button[aria-selected="true"]{ background: var(--brand); color: var(--brand-ink); }

/* ---------- room cards ---------- */
.rcard{
  display:flex; align-items:center; gap:14px; width:100%; text-align:start;
  background: var(--card); border-radius: var(--r-card); box-shadow: var(--sh);
  padding:15px 16px; margin-bottom:12px;
}
.rcard:hover{ box-shadow: 0 10px 26px rgba(46,42,51,.11); }
.rcard:active{ transform: scale(.99); }
.rcard .t{ flex:1; min-width:0; }
.rcard h4{ font-size:17px; margin-bottom:2px; }
.rcard .meta{ font-size:12px; color:var(--muted); }
.rcard .foot{ display:flex; align-items:center; gap:8px; margin-top:11px; font-size:12px; color:var(--ink-2); flex-wrap:wrap; }
.rcard .chipn{
  display:inline-flex; align-items:center; gap:5px; background: var(--card-2);
  border-radius: var(--r-pill); padding:3px 9px; font-variant-numeric:tabular-nums;
}
.rcard .chipn i{ width:7px; height:7px; border-radius:50%; flex:none; }
.ring{ position:relative; width:66px; height:66px; flex:none; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .bgc{ fill:none; stroke: var(--card-3); stroke-width:7; }
.ring .fgc{ fill:none; stroke: var(--d-done); stroke-width:7; stroke-linecap:round; transition: stroke-dasharray .5s cubic-bezier(.3,.8,.4,1); }
.ring .lab{
  position:absolute; inset:0; display:grid; place-items:center;
  font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;
}

/* ---------- timeline ---------- */
.phase{ background: var(--card); border-radius: var(--r-card); box-shadow: var(--sh); padding:15px 16px; margin-bottom:13px; }
.phase-h{ display:flex; align-items:flex-start; gap:11px; }
.phase-dot{ width:12px; height:12px; border-radius:50%; margin-top:6px; flex:none; background: var(--line-2); }
.phase.now  .phase-dot{ background: var(--d-buy); }
.phase.late .phase-dot{ background: var(--d-alert); }
.phase-h h4{ font-size:15.5px; }
.phase-h .sum{ margin-inline-start:auto; font-size:13.5px; font-weight:700; font-variant-numeric:tabular-nums; }
.phase .tag{
  display:inline-block; font-size:11.5px; font-weight:600; border-radius: var(--r-pill);
  padding:2px 9px; margin-top:5px; background: var(--card-2); color: var(--ink-2);
}
.phase.now  .tag{ background: color-mix(in srgb, var(--d-buy) 16%, transparent);   color: var(--d-buy); }
.phase.late .tag{ background: color-mix(in srgb, var(--d-alert) 16%, transparent); color: var(--d-alert); }
.phase .note{ font-size:12.5px; color:var(--muted); margin:9px 0 0; }
.phase .win{ font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; margin-top:4px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.chip{
  display:inline-flex; align-items:center; gap:7px; background: var(--card-2);
  border-radius: var(--r-pill); padding:5px 11px; font-size:12.5px;
}
.chip b{ font-variant-numeric:tabular-nums; color: var(--ink-2); }
.chip .rm{ color:var(--muted); font-size:11.5px; }

/* ---------- charts ---------- */
.chart{ width:100%; height:auto; display:block; overflow:visible; }
.grid-l{ stroke: var(--line); stroke-width:1; }
.axis-t{ fill: var(--muted); font-size:11px; direction:ltr; }
.bar-a{ fill: var(--d-home); }
.bar-b{ fill: var(--d-buy); }
.area-f{ fill: var(--d-buy); opacity:.16; }
.area-s{ fill:none; stroke: var(--d-buy); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.dot-e{ fill: var(--d-buy); stroke: var(--card); stroke-width:2; }
.keys{ display:flex; gap:16px; justify-content:center; margin-top:10px; font-size:12px; color:var(--ink-2); }
.keys span{ display:inline-flex; align-items:center; gap:6px; }
.keys i{ width:9px; height:9px; border-radius:3px; flex:none; }

.rowbar{ display:grid; grid-template-columns: 1fr 96px; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
.rowbar:last-child{ border-bottom:0; }
.rowbar .nm{ font-size:13px; font-weight:600; margin-bottom:5px; }
.rowbar .track{ position:relative; height:9px; border-radius:5px; background: var(--card-3); display:flex; gap:2px; overflow:hidden; }
.rowbar .track i{ display:block; height:100%; }
.rowbar .bmark{ position:absolute; top:-3px; bottom:-3px; width:2px; background: var(--ink); opacity:.6; }
.rowbar .v{ font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink-2); text-align:start; }
.rowbar .v .over{ color: var(--d-alert); font-weight:700; }

/* ---------- bottom nav ---------- */
.tabbar{
  position:fixed; bottom:0; inset-inline:0; min-height: var(--navh); z-index:40;
  max-width: var(--appw); margin:0 auto;
  background: var(--card); border-radius: 26px 26px 0 0; box-shadow: 0 -6px 24px rgba(46,42,51,.10);
  display:flex; align-items:center; justify-content:space-around;
  padding: 0 12px env(safe-area-inset-bottom);
}
.tabbar button{ display:grid; place-items:center; gap:3px; color: var(--muted); padding:6px 10px; border-radius:14px; }
.tabbar button .cap{ font-size:10.5px; font-weight:600; }
.tabbar button[aria-selected="true"]{ color: var(--brand); }
.tabbar button.fab{
  width:56px; height:56px; border-radius:50%; background: var(--brand); color: var(--brand-ink);
  display:grid; place-items:center; box-shadow: var(--sh-fab); margin-top:-22px; flex:none;
}
.tabbar button.fab:active{ transform: scale(.95); }

/* ---------- sheet ---------- */
.scrim{ position:fixed; inset:0; background: rgba(24,20,28,.45); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s; }
.scrim.on{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; inset-inline:0; bottom:0; z-index:51; max-width: var(--appw); margin:0 auto;
  background: var(--card); border-radius: 26px 26px 0 0; box-shadow: var(--sh-lg);
  max-height: 90vh; max-height: 90dvh; display:flex; flex-direction:column;
  transform: translateY(100%); transition: transform .26s cubic-bezier(.3,.85,.35,1);
}
.sheet.on{ transform: translateY(0); }
.sh-grab{ width:42px; height:5px; border-radius:3px; background: var(--line-2); margin:10px auto 4px; flex:none; }
.sh-head{ padding: 6px 18px 14px; display:flex; align-items:center; gap:13px; flex:none; }
.sh-head .t{ flex:1; min-width:0; }
.sh-head h3{ font-size:20px; }
.sh-head .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
.sh-close{ width:34px; height:34px; border-radius:50%; background: var(--card-2); display:grid; place-items:center; flex:none; color:var(--ink-2); }
.sh-stats{ display:flex; gap:9px; padding:0 18px 12px; flex:none; }
.sh-stats div{ flex:1; background: var(--card-2); border-radius: var(--r-sm); padding:9px 11px; }
.sh-stats .l{ font-size:10.5px; color:var(--muted); font-weight:600; }
.sh-stats .v{ font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:1px; }
.sh-budget{ display:flex; align-items:center; gap:9px; padding:0 18px 13px; font-size:12.5px; color:var(--ink-2); flex:none; flex-wrap:wrap; }
.sh-budget input{
  width:94px; background: var(--card-2); border:0; border-radius:10px; padding:6px 10px;
  font-variant-numeric:tabular-nums; font-size:13px;
}
.sh-body{ overflow-y:auto; flex:1; padding: 2px 18px calc(20px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch; }

/* ---------- item row ---------- */
.item{ display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.item:last-child{ border-bottom:0; }
.tick{
  width:24px; height:24px; border-radius:8px; border:2px solid var(--line-2); flex:none; margin-top:2px;
  display:grid; place-items:center; color:transparent; transition: background .16s, border-color .16s, color .16s;
}
.item.is-done .tick{ background: var(--d-done); border-color: var(--d-done); color:#fff; }
.item.is-home .tick{ background: var(--d-home); border-color: var(--d-home); color:#fff; }
.item .body{ flex:1; min-width:0; }
.item .nm{
  width:100%; background:transparent; border:0; padding:0; font-size:14.5px; font-weight:600;
  border-bottom:1px dashed transparent;
}
.item .nm:hover, .item .nm:focus{ border-bottom-color: var(--line-2); }
.item.is-done .nm{ text-decoration: line-through; color: var(--muted); }
.item.is-home .nm{ color: var(--ink-2); }
.item .sub{ display:flex; align-items:center; gap:8px; margin-top:7px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
.item .price{
  width:74px; background: var(--card-2); border:0; border-radius:9px; padding:4px 8px;
  font-size:12.5px; font-variant-numeric:tabular-nums;
}
.item .store{ width:96px; background: var(--card-2); border:0; border-radius:9px; padding:4px 8px; font-size:12.5px; }
.item .due{ font-variant-numeric:tabular-nums; }
.item .due.late{ color: var(--d-alert); font-weight:700; }
.item .del{ color: var(--muted); font-size:19px; line-height:1; padding:2px 4px; flex:none; }
.item .del:hover{ color: var(--d-alert); }
.seg{ display:inline-flex; background: var(--card-2); border-radius: var(--r-pill); padding:3px; margin-top:9px; }
.seg button{ border-radius: var(--r-pill); padding:5px 11px; font-size:11.5px; font-weight:600; color: var(--muted); }
.seg button[aria-pressed="true"]{ color:#fff; }
.seg button[data-s="home"][aria-pressed="true"]{ background: var(--d-home); }
.seg button[data-s="buy"][aria-pressed="true"]{  background: var(--d-buy); }
.seg button[data-s="done"][aria-pressed="true"]{ background: var(--d-done); }

.btn{ background: var(--brand); color: var(--brand-ink); border-radius: var(--r-pill); padding:11px 20px; font-size:14px; font-weight:600; }
.btn.ghost{ background: var(--card-2); color: var(--ink); }
.btn.sm{ padding:7px 14px; font-size:12.5px; }
.btn.block{ width:100%; }

.field{ margin-bottom:13px; }
.field label{ display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:5px; }
.field input, .field select{
  width:100%; background: var(--card-2); border:0; border-radius: var(--r-sm); padding:11px 13px; font-size:14.5px;
}
.settings-row{ display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px; }
.settings-row:last-of-type{ border-bottom:0; }
.settings-row .lbl{ flex:1; }
.settings-row input{ width:130px; background: var(--card-2); border:0; border-radius:10px; padding:8px 11px; font-variant-numeric:tabular-nums; text-align:start; }

/* editable room title in the sheet header */
.sh-title-input{
  width:100%; background:transparent; border:0; padding:2px 0;
  font-size:20px; font-weight:700; letter-spacing:-.02em; color: var(--ink);
  border-bottom:1.5px dashed var(--line-2);
}
.sh-title-input:focus{ border-bottom-color: var(--brand); outline:none; }
.sh-title-hint{ font-size:11px; color:var(--muted); margin-top:3px; }

.addroom{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  background: var(--card); border:1.5px dashed var(--line-2); border-radius: var(--r-card);
  padding:15px; margin-bottom:12px; font-size:14.5px; font-weight:600; color: var(--ink-2);
}
.addroom:hover{ border-color: var(--brand); color: var(--brand); }

/* prevent iOS from zooming in on focus (fires when input font < 16px) */
@media (pointer: coarse){
  input, select, .item .nm, .sh-title-input{ font-size:16px; }
  .item .price{ width:84px; }
  .item .store{ width:118px; }
}

.view{ display:none; }
.view.on{ display:block; animation: rise .28s cubic-bezier(.3,.8,.4,1); }
@keyframes rise{ from{ opacity:0; transform: translateY(9px); } }

.toast{
  position:fixed; bottom: calc(var(--navh) + 16px + env(safe-area-inset-bottom)); inset-inline:0; margin:auto; width:max-content; max-width:86vw;
  background: var(--ink); color: var(--card); padding:10px 18px; border-radius: var(--r-pill);
  font-size:13.5px; z-index:80; opacity:0; transform: translateY(8px);
  transition: opacity .2s, transform .2s; pointer-events:none; box-shadow: var(--sh);
}
.toast.on{ opacity:1; transform: translateY(0); }
.empty{ text-align:center; color:var(--muted); font-size:13.5px; padding:34px 12px; }

@media (prefers-reduced-motion: reduce){ *{ transition-duration:.01ms !important; animation-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="apphead">

const STATUS = {
  home: { label:"לוקחים מהבית", short:"מהבית", v:"home" },

/* ============================================================
   HELPERS
   ============================================================ */
const $  = (s,c)=> (c||document).querySelector(s);
const $$ = (s,c)=> Array.from((c||document).querySelectorAll(s));
const nf = new Intl.NumberFormat("he-IL",{ maximumFractionDigits:0 });
const cf = new Intl.NumberFormat("he-IL",{ style:"currency", currency:"ILS", maximumFractionDigits:0 });
const money = v => cf.format(Math.round(v||0));
const esc = s => String(s??"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const DAY = 86400000;
const today = ()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
const fmtDate = d => d ? d.toLocaleDateString("he-IL",{ day:"2-digit", month:"2-digit", year:"2-digit" }) : "—";

/* ============================================================
   STATE — one phone, localStorage, nothing else
   ============================================================ */
const KEY = "newhome.plan.v2";
let state, uiRoom = null, uiView = "rooms", roomFilter = "all";

function defaultMoveIn(){ const d=new Date(); d.setMonth(d.getMonth()+9); return d.toISOString().slice(0,10); }
function seedState(){
  let n=0; const items=[];
  const rooms = DEFAULT_ROOMS.map(([id,name])=>({ id, name }));
  for (const r of rooms)
    for (const [name, est, lead, st] of (SEED[r.id]||[]))
      items.push({ id:"i"+(++n), room:r.id, name, est, actual:null, status:st, lead, store:"" });
  const roomBudgets = {};
  for (const r of rooms)
    roomBudgets[r.id] = Math.round(items.filter(i=>i.room===r.id).reduce((a,i)=>a+i.est,0)/500)*500;
  return { v:2, moveIn: defaultMoveIn(), budget:150000, rooms, roomBudgets, items, seq:n };
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.items) && s.items.length) return s;
  }catch(e){}
  return seedState();
}
function normalize(s){
  const out = seedState();
  out.moveIn = typeof s.moveIn === "string" ? s.moveIn : out.moveIn;
  out.budget = Number.isFinite(+s.budget) ? +s.budget : out.budget;
  out.seq = +s.seq || 0;

  /* rooms: use saved set if valid, otherwise the default set (migrates old
     saves that predate editable rooms). Names get trimmed and de-blanked. */
  let rooms = Array.isArray(s.rooms)
    ? s.rooms.filter(r=> r && typeof r.id==="string")
             .map(r=>({ id:r.id, name:String(r.name||"חדר").trim() || "חדר" }))
    : out.rooms;
  if (!rooms.length) rooms = out.rooms;
  /* any item pointing at a room that no longer exists keeps a home for it */
  const known = new Set(rooms.map(r=>r.id));
  const orphaned = new Set((s.items||[]).map(i=>i&&i.room).filter(id=> id && !known.has(id)));
  for (const id of orphaned){ rooms.push({ id, name:"חדר" }); known.add(id); }
  out.rooms = rooms;

  out.roomBudgets = {};
  for (const r of rooms) out.roomBudgets[r.id] =
    (s.roomBudgets && Number.isFinite(+s.roomBudgets[r.id])) ? +s.roomBudgets[r.id] : 0;

  out.items = (s.items||[]).filter(i=> i && known.has(i.room)).map((i,ix)=>({
    id: i.id || ("i"+ix+"_"+Date.now().toString(36)),
    room: i.room, name: String(i.name||"פריט"),
    est: Math.max(0, +i.est||0),
    actual: i.actual==null ? null : Math.max(0, +i.actual||0),
    status: STATUS[i.status] ? i.status : "buy",
    lead: Math.min(52, Math.max(0, +i.lead||2)),
    store: String(i.store||"")
  }));
  return out;
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }, 200);
}
function commit(){ save(); renderAll(); }

/* ---- derived ---- */
const moveInDate = ()=>{ const d = new Date(state.moveIn+"T00:00:00"); return isNaN(d) ? null : d; };
function orderBy(i){ const m = moveInDate(); return m ? new Date(m.getTime() - (i.lead||2)*7*DAY) : null; }
const daysTo = d => d ? Math.round((d - today())/DAY) : null;
const roomItems = id => state.items.filter(i=>i.room===id);
function totals(items){
  let paid=0, planned=0, saved=0, nHome=0, nBuy=0, nDone=0;
  for (const i of items){
    if (i.status==="home"){ saved += i.est; nHome++; }
    else if (i.status==="done"){ paid += (i.actual!=null?i.actual:i.est); nDone++; }
    else { planned += i.est; nBuy++; }
  }
  return { paid, planned, saved, projected:paid+planned, nHome, nBuy, nDone, n:items.length };
}
function readiness(id){
  const its = roomItems(id);
  return its.length ? its.filter(i=>i.status!=="buy").length / its.length : 0;
}
const projected = i => i.status==="home" ? 0 : (i.status==="done" ? (i.actual!=null?i.actual:i.est) : i.est);

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2100);
}

/* ============================================================
   ROOM CARDS
   ============================================================ */
function ringHTML(pct, size){
  const R = 28, C = 2*Math.PI*R;
  /* a round cap on a zero-length arc paints a stray dot, so drop the arc at 0 */
  const arc = pct > 0.5
    ? `<circle class="fgc" cx="33" cy="33" r="${R}" stroke-dasharray="${(C*pct/100).toFixed(1)} ${C.toFixed(1)}"/>`
    : "";
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 66 66"><circle class="bgc" cx="33" cy="33" r="${R}"/>${arc}</svg>
    <span class="lab">${Math.round(pct)}%</span></div>`;
}
function renderRoomCards(){
  const rows = state.rooms.filter(r=>{
    if (roomFilter==="all") return true;
    const done = readiness(r.id) === 1 && roomItems(r.id).length > 0;
    return roomFilter==="done" ? done : !done;
  });
  const cards = rows.map(r=>{
    const t = totals(roomItems(r.id)), pct = readiness(r.id)*100;
    const b = state.roomBudgets[r.id] || 0, over = t.projected > b && b > 0;
    return `<button class="rcard" data-room="${r.id}">
      <div class="t">
        <h4>${esc(r.name)}</h4>
        <div class="foot">
          <span class="chipn"><i style="background:var(--d-buy)"></i>${t.nBuy} לקנות</span>
          <span class="chipn"><i style="background:var(--d-done)"></i>${t.nDone} נקנו</span>
          <span class="chipn"><i style="background:var(--d-home)"></i>${t.nHome} מהבית</span>
          ${ t.projected||b ? `<span class="chipn" style="${over?"color:var(--d-alert);font-weight:700":""}">${money(t.projected)}${ b? " / " + money(b) : "" }</span>` : "" }
        </div>
      </div>
      ${ringHTML(pct, 66)}
    </button>`;
  }).join("");
  const addBtn = `<button class="addroom" id="addRoomBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    הוספת חדר</button>`;
  $("#roomCards").innerHTML =
    (rows.length ? cards : `<p class="empty">אין חדרים בקטגוריה הזו.</p>`) +
    (roomFilter==="all" ? addBtn : "");
  $$("#roomCards .rcard").forEach(b=> b.addEventListener("click", ()=> openRoom(b.dataset.room)));
  const ab = $("#addRoomBtn"); if (ab) ab.addEventListener("click", addRoom);
}

/* ============================================================
   TIMELINE
   ============================================================ */
function renderPhases(){
  const pend = state.items.filter(i=>i.status==="buy"), m = moveInDate();
  if (!pend.length || !m){ $("#phases").innerHTML = `<p class="empty">אין פריטים שממתינים להזמנה.</p>`; return; }
  const now = today(), by = new Map(PHASES.map(p=>[p.id,[]]));
  for (const i of pend) by.get(phaseOf(i.lead||0).id).push(i);

  $("#phases").innerHTML = PHASES.map(p=>{
    const items = by.get(p.id); if (!items.length) return "";
    const deadline = new Date(m.getTime() - p.lo*7*DAY);
    const opens = p.hi >= 999 ? null : new Date(m.getTime() - p.hi*7*DAY);
    let cls="", tag="";
    if (deadline < now){ cls="late"; tag="חלון ההזמנה נסגר"; }
    else if (!opens || opens <= now){ cls="now"; tag="פתוח להזמנה עכשיו"; }
    else { tag = "נפתח בעוד " + nf.format(Math.round((opens-now)/DAY)) + " ימים"; }
    items.sort((a,b)=> b.est - a.est);
    return `<div class="phase ${cls}">
      <div class="phase-h">
        <span class="phase-dot"></span>
        <div style="flex:1;min-width:0">
          <h4>${esc(p.name)}</h4>
          <span class="tag">${esc(tag)} · ${items.length} פריטים</span>
        </div>
        <span class="sum">${money(items.reduce((a,i)=>a+i.est,0))}</span>
      </div>
      <p class="note">${esc(p.note)}</p>
      <div class="win">חלון ההזמנה: ${ opens ? fmtDate(opens)+" – "+fmtDate(deadline) : "עד "+fmtDate(deadline) }</div>
      <div class="chips">${items.map(i=>`<button class="chip" data-room="${i.room}">
        <span>${esc(i.name)}</span><b>${money(i.est)}</b><span class="rm">${esc(roomName(i.room))}</span></button>`).join("")}</div>
    </div>`;
  }).join("");
  $$("#phases .chip").forEach(c=> c.addEventListener("click", ()=> openRoom(c.dataset.room)));
}

/* ============================================================
   CHARTS
   ============================================================ */
function niceMax(v){
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  return Math.ceil(v/mag)*mag;
}
function renderPhaseChart(){
  const rows = PHASES.map(p=>{
    const its = state.items.filter(i=> i.status!=="home" && phaseOf(i.lead||0).id === p.id);
    const t = totals(its);
    return { short: p.name.split(/[ ,]/)[0], paid:t.paid, planned:t.planned };
  });
  /* RTL: the value gutter sits on the right and the phases run right to left,
     so the eye enters the chart where it enters the page. */
  const W=340, H=180, GUT=38, PADL=8, PT=10, PB=32;
  const x0 = PADL, x1 = W-GUT, iw = x1-x0, ih = H-PT-PB;
  const max = niceMax(Math.max(...rows.map(r=>Math.max(r.paid, r.planned)), 1));
  const bw = iw/rows.length, barw = Math.min(13, bw/2 - 3);
  const y = v => PT + ih - (v/max)*ih;

  let g = "";
  for (let k=0; k<=4; k++){
    const v = max*k/4, yy = y(v);
    g += `<line class="grid-l" x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}"/>
          <text class="axis-t" x="${x1+5}" y="${yy+4}" text-anchor="start">${nf.format(v/1000)}k</text>`;
  }
  /* bars grow from the baseline, with a 2px surface gap inside each pair */
  const bars = rows.map((r,ix)=>{
    const cx = x1 - bw*(ix + 0.5);
    const bA = `<rect class="bar-a" x="${cx + 1}" y="${y(r.paid)}" width="${barw}" height="${Math.max(0, PT+ih-y(r.paid))}" rx="3"><title>${esc(r.short)} · שולם ${money(r.paid)}</title></rect>`;
    const bB = `<rect class="bar-b" x="${cx - barw - 1}" y="${y(r.planned)}" width="${barw}" height="${Math.max(0, PT+ih-y(r.planned))}" rx="3"><title>${esc(r.short)} · מתוכנן ${money(r.planned)}</title></rect>`;
    return bA + bB + `<text class="axis-t" x="${cx}" y="${H-PB+16}" text-anchor="middle" style="direction:rtl">${esc(r.short)}</text>`;
  }).join("");
  $("#phaseChart").innerHTML = g + bars +
    `<line class="grid-l" x1="${x0}" y1="${PT+ih}" x2="${x1}" y2="${PT+ih}" stroke="var(--line-2)"/>`;
}

function renderCumChart(){
  const pend = state.items.filter(i=> i.status!=="home");
  const byMonth = new Map();
  for (const i of pend){
    const ob = orderBy(i); if (!ob) continue;
    const k = ob.getFullYear()+"-"+String(ob.getMonth()+1).padStart(2,"0");
    if (!byMonth.has(k)) byMonth.set(k, { k, d:new Date(ob.getFullYear(), ob.getMonth(), 1), v:0 });
    byMonth.get(k).v += projected(i);
  }
  const pts = Array.from(byMonth.values()).sort((a,b)=>a.d-b.d);
  if (pts.length < 2){ $("#cumChart").innerHTML = ""; $("#cumSide").textContent = ""; return; }
  let run = 0; pts.forEach(p=>{ run += p.v; p.c = run; });

  /* RTL: earliest month on the right, so the curve builds leftwards. */
  const W=340, H=170, GUT=38, PADL=10, PT=12, PB=30;
  const x0 = PADL, x1 = W-GUT, iw = x1-x0, ih = H-PT-PB;
  const max = niceMax(run);
  const X = ix => x1 - (iw * ix/(pts.length-1));
  const Y = v => PT + ih - (v/max)*ih;

  let g = "";
  for (let k=0;k<=4;k++){
    const v = max*k/4, yy = Y(v);
    g += `<line class="grid-l" x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}"/>
          <text class="axis-t" x="${x1+5}" y="${yy+4}" text-anchor="start">${nf.format(v/1000)}k</text>`;
  }
  const line = pts.map((p,ix)=> (ix?"L":"M") + X(ix).toFixed(1) + " " + Y(p.c).toFixed(1)).join(" ");
  const base = (PT+ih).toFixed(1);
  const area = line + ` L ${X(pts.length-1).toFixed(1)} ${base} L ${X(0).toFixed(1)} ${base} Z`;
  const labels = pts.map((p,ix)=>{
    if (pts.length > 6 && ix % 2) return "";
    return `<text class="axis-t" x="${X(ix)}" y="${H-PB+16}" text-anchor="middle">${p.d.toLocaleDateString("he-IL",{month:"short"})}</text>`;
  }).join("");
  const last = pts.length-1;
  $("#cumChart").innerHTML = g +
    `<path class="area-f" d="${area}"/><path class="area-s" d="${line}"/>` +
    `<circle class="dot-e" cx="${X(last)}" cy="${Y(pts[last].c)}" r="5"/>` + labels;
  $("#cumSide").textContent = "עד הכניסה · " + money(run);
}

function renderRoomBars(){
  const scale = Math.max(...state.rooms.map(r=> Math.max(totals(roomItems(r.id)).projected, state.roomBudgets[r.id]||0)), 1) * 1.05;
  $("#roomBars").innerHTML = state.rooms.map(r=>{
    const t = totals(roomItems(r.id)), b = state.roomBudgets[r.id]||0, diff = b - t.projected;
    return `<div class="rowbar" data-room="${r.id}">
      <div>
        <div class="nm">${esc(r.name)}</div>
        <div class="track" title="${esc(r.name)}: שולם ${money(t.paid)}, מתוכנן ${money(t.planned)}, תקציב ${money(b)}">
          <i style="width:${t.paid/scale*100}%;background:var(--d-done)"></i>
          <i style="width:${t.planned/scale*100}%;background:var(--d-buy)"></i>
          ${ b>0 ? `<span class="bmark" style="inset-inline-start:${Math.min(b/scale*100,99.4)}%"></span>` : "" }
        </div>
      </div>
      <div class="v">${money(t.projected)}${ diff<0 ? ` <span class="over">+${money(-diff)}</span>` : "" }</div>
    </div>`;
  }).join("");
  $$("#roomBars .rowbar").forEach(el=> el.addEventListener("click", ()=> openRoom(el.dataset.room)));
}

function openSheet(){ $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); }
function closeSheet(){
  $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on");
  uiRoom = null; $("#shExtra").innerHTML = "";
}
function setHead(html){ $("#shT").innerHTML = html; }
function openRoom(id){
  uiRoom = id; renderRoom(); openSheet();
}

function addRoom(){
  state.seq = (state.seq||0)+1;
  const id = "r"+state.seq+"_"+Date.now().toString(36);
  state.rooms.push({ id, name:"חדר חדש" });
  state.roomBudgets[id] = 0;
  save(); renderAll();
  openRoom(id);
  setTimeout(()=>{ const n = $("#shName"); if (n){ n.focus(); n.select(); } }, 90);
}

let roomDelArmed = false, roomDelTimer;
function renderRoom(){
  if (!uiRoom) return;
  const r = roomById(uiRoom); if (!r) { closeSheet(); return; }
  const its = roomItems(uiRoom), t = totals(its);
  const b = state.roomBudgets[uiRoom] || 0, diff = b - t.projected;

  setHead(`<input class="sh-title-input" id="shName" value="${esc(r.name)}" aria-label="שם החדר" maxlength="40">
           <div class="sh-title-hint">לחיצה על השם עורכת אותו</div>`);

  $("#shExtra").innerHTML = `
    <div class="sh-stats">
      <div><div class="l">צפי הוצאה</div><div class="v">${money(t.projected)}</div></div>
      <div><div class="l">שולם</div><div class="v" style="color:var(--d-done)">${money(t.paid)}</div></div>
      <div><div class="l">נחסך מהבית</div><div class="v" style="color:var(--d-home)">${money(t.saved)}</div></div>
    </div>
    <div class="sh-budget">
      <label for="shBudget">תקציב לחדר</label>
      <input type="number" id="shBudget" min="0" step="500" value="${b}">
      <span class="n" style="color:${diff>=0?"var(--d-done)":"var(--d-alert)"}">
        ${ diff>=0 ? "נשאר "+money(diff) : "חריגה "+money(-diff) }</span>
    </div>`;

  $("#shBody").innerHTML =
    (its.length ? its.map(itemHTML).join("") : `<p class="empty">אין עדיין פריטים בחדר הזה.</p>`) +
    `<button class="btn ghost block" id="shAdd" style="margin-top:16px">הוספת פריט לחדר</button>
     <button class="btn ghost block" id="shDelRoom" style="margin-top:9px;color:var(--d-alert)">מחיקת החדר כולו</button>`;

  $("#shName").addEventListener("change", e=>{
    const r2 = roomById(uiRoom); if (!r2) return;
    r2.name = e.target.value.trim() || "חדר"; save(); renderRoomCards(); renderRoomBars(); renderHeader();
  });
  $("#shBudget").addEventListener("change", e=>{
    state.roomBudgets[uiRoom] = Math.max(0, +e.target.value||0); commit();
  });
  $("#shAdd").addEventListener("click", ()=> addItemTo(uiRoom));

  roomDelArmed = false;
  $("#shDelRoom").addEventListener("click", e=>{
    const btn = e.currentTarget;
    if (!roomDelArmed){
      roomDelArmed = true;
      btn.textContent = "לחץ שוב למחיקת החדר וכל הפריטים בו";
      clearTimeout(roomDelTimer);
      roomDelTimer = setTimeout(()=>{ roomDelArmed=false; if($("#shDelRoom")) $("#shDelRoom").textContent="מחיקת החדר כולו"; }, 5000);
      return;
    }
    clearTimeout(roomDelTimer);
    const id = uiRoom;
    state.items = state.items.filter(i=>i.room!==id);
    state.rooms = state.rooms.filter(r2=>r2.id!==id);
    delete state.roomBudgets[id];
    closeSheet(); commit(); toast("החדר נמחק");
  });

  wireItems();
}

function itemHTML(i){
  const ob = orderBy(i), d = daysTo(ob);
  const late = i.status==="buy" && d!=null && d<0;
  const delta = (i.status==="done" && i.actual!=null) ? i.actual - i.est : null;
  return `<div class="item is-${i.status}" data-id="${i.id}">
    <button class="tick" data-cycle aria-label="שינוי סטטוס">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </button>
    <div class="body">
      <input class="nm" value="${esc(i.name)}" data-f="name" aria-label="שם הפריט">
      <div class="sub">
        <span>הערכה <input class="price" type="number" min="0" step="50" value="${i.est}" data-f="est" aria-label="מחיר משוער"></span>
        ${ i.status==="done" ? `<span>בפועל <input class="price" type="number" min="0" step="50" value="${i.actual!=null?i.actual:""}" placeholder="—" data-f="actual" aria-label="מחיר בפועל"></span>` : "" }
        ${ delta!=null && delta!==0 ? `<span style="color:${delta>0?"var(--d-alert)":"var(--d-done)"};font-weight:700">${delta>0?"▲":"▼"} ${money(Math.abs(delta))}</span>` : "" }
        ${ i.status!=="home" ? `<span><input class="store" type="text" value="${esc(i.store||"")}" placeholder="חנות" data-f="store" aria-label="חנות"></span>` : "" }
        ${ i.status==="buy" ? `<span>אספקה <input class="price" style="width:52px" type="number" min="0" max="52" value="${i.lead}" data-f="lead" aria-label="שבועות אספקה"> שב׳</span>
             <span class="due ${late?"late":""}">${late?"היה להזמין ":"להזמין עד "}${fmtDate(ob)}</span>` : "" }
      </div>
      <div class="seg" role="group" aria-label="סטטוס">
        ${Object.keys(STATUS).map(s=>`<button data-s="${s}" aria-pressed="${i.status===s}">${STATUS[s].short}</button>`).join("")}
      </div>
    </div>
    <button class="del" aria-label="מחיקת ${esc(i.name)}">×</button>
  </div>`;
}

function wireItems(){
  $$("#shBody .item").forEach(el=>{
    const id = el.dataset.id, it = state.items.find(x=>x.id===id);
    if (!it) return;
    $$("input[data-f]", el).forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const f = inp.dataset.f;
        if (f==="name")        it.name = inp.value.trim() || "פריט";
        else if (f==="store")  it.store = inp.value.trim();
        else if (f==="actual") it.actual = inp.value==="" ? null : Math.max(0, +inp.value||0);
        else if (f==="lead")   it.lead = Math.min(52, Math.max(0, +inp.value||0));
        else                   it.est = Math.max(0, +inp.value||0);
        commit();
      });
    });
    $$(".seg button", el).forEach(btn=> btn.addEventListener("click", ()=>{
      it.status = btn.dataset.s;
      if (it.status==="done" && it.actual==null) it.actual = it.est;
      commit();
    }));
    $("[data-cycle]", el).addEventListener("click", ()=>{
      it.status = it.status==="buy" ? "done" : (it.status==="done" ? "home" : "buy");
      if (it.status==="done" && it.actual==null) it.actual = it.est;
      commit();
    });
    $(".del", el).addEventListener("click", ()=>{
      state.items = state.items.filter(x=>x.id!==id);
      commit(); toast("הפריט נמחק");
    });
  });
}

function addItemTo(roomId){
  state.seq = (state.seq||0)+1;
  const fresh = { id:"i"+state.seq+"_"+Date.now().toString(36), room:roomId,
                  name:"פריט חדש", est:0, actual:null, status:"buy", lead:2, store:"" };
  state.items.push(fresh);
  if (uiRoom !== roomId) openRoom(roomId); else commit();
  setTimeout(()=>{
    const rows = $$("#shBody .item"), last = rows[rows.length-1];
    if (last){ last.scrollIntoView({ block:"nearest" }); const n = $(".nm", last); n.focus(); n.select(); }
  }, 60);
}

      <input type="date" id="stMove" value="${state.moveIn}"></div>
    <div class="settings-row"><span class="lbl">תקציב כולל</span>
      <input type="number" id="stBudget" min="0" step="1000" value="${state.budget}"></div>
    <p class="lede" style="margin:16px 0 10px">גיבוי שומר קובץ שאפשר לייבא בחזרה אם תחליף מכשיר או תנקה את הדפדפן.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn ghost sm" id="stExport">גיבוי לקובץ</button>
      <button class="btn ghost sm" id="stImport">ייבוא מגיבוי</button>
      <button class="btn ghost sm" id="stReset" style="color:var(--d-alert)">איפוס לרשימה המקורית</button>
    </div>
    <input type="file" id="stFile" accept="application/json,.json" hidden>`;

  $("#stMove").addEventListener("change", e=>{ state.moveIn = e.target.value; commit(); renderHeader(); });
  $("#stBudget").addEventListener("change", e=>{ state.budget = Math.max(0, +e.target.value||0); commit(); });

  $("#stExport").addEventListener("click", async ()=>{
    const data = JSON.stringify(state, null, 2);
    if (window.claude && window.claude.downloads){
      try{ await window.claude.downloads.save({ filename:"הבית-החדש-גיבוי.json", data }); toast("הגיבוי נשמר"); return; }
      catch(err){ if (err && err.code === "declined"){ toast("הגיבוי בוטל"); return; } }
    }
    try{ await navigator.clipboard.writeText(data); toast("הגיבוי הועתק ללוח"); }
    catch(e){ toast("לא הצלחתי לשמור גיבוי"); }
  });

  $("#stImport").addEventListener("click", ()=> $("#stFile").click());
  $("#stFile").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const s = JSON.parse(fr.result);
        if (!s || !Array.isArray(s.items)) throw 0;
        state = normalize(s); closeSheet(); commit(); toast("הגיבוי יובא");
      }catch(err){ toast("הקובץ לא תקין"); }
    };
    fr.readAsText(f);
  });

  let armed = false, armTimer;
  $("#stReset").addEventListener("click", e=>{
    const btn = e.currentTarget;
    if (!armed){
      armed = true; btn.textContent = "לחץ שוב לאישור";
      armTimer = setTimeout(()=>{ armed=false; btn.textContent="איפוס לרשימה המקורית"; }, 5000);
      return;
    }
    clearTimeout(armTimer);
    state = seedState(); closeSheet(); commit(); toast("הרשימה אופסה");
  });

  openSheet();
}

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
function renderAll(){
  renderHeader(); renderTiles(); renderRoomCards();
  renderPhases(); renderPhaseChart(); renderCumChart(); renderRoomBars();
  if (uiRoom) renderRoom();
}

$$(".tabbar [data-v]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    uiView = btn.dataset.v;
    $$(".tabbar [data-v]").forEach(b=> b.setAttribute("aria-selected", String(b===btn)));
    $$(".view").forEach(v=> v.classList.toggle("on", v.id === "v-"+uiView));
    renderHeader();
    window.scrollTo({ top:0, behavior:"smooth" });
  });
});
$$("#roomPills button").forEach(b=>{
  b.addEventListener("click", ()=>{
    roomFilter = b.dataset.f;
    $$("#roomPills button").forEach(x=> x.setAttribute("aria-selected", String(x===b)));
    renderRoomCards();
  });
});
$("#fab").addEventListener("click", ()=> uiRoom ? addItemTo(uiRoom) : openAddSheet());
$("#settingsTab").addEventListener("click", openSettings);
$("#scrim").addEventListener("click", closeSheet);
$("#shClose").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if (e.key==="Escape") closeSheet(); });

const root = document.documentElement;
$("#themeBtn").addEventListener("click", ()=>{
  const cur = root.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur==="dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
  root.setAttribute("data-theme", next);
  try{ localStorage.setItem(KEY+".theme", next); }catch(e){}
});
try{ const th = localStorage.getItem(KEY+".theme"); if (th) root.setAttribute("data-theme", th); }catch(e){}

state = normalize(load());
renderAll();
save();
})();
</script>
</body>
</html>
