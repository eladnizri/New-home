    v.openings = read().concat([{ id:newOpId(), type:"door", wall:"bottom", pos:40, len:80, hinge:0 }]); save(); openOpenings();
  });
  $$("#shBody [data-del]").forEach(b=> b.addEventListener("click", ()=>{
    v.openings = read().filter((_,i)=> i !== +b.dataset.del); save(); openOpenings();
  }));
  $$("#shBody [data-flip]").forEach(b=> b.addEventListener("click", ()=>{
    const arr = read(); arr[+b.dataset.flip].hinge = arr[+b.dataset.flip].hinge===1?0:1;
    v.openings = arr; save(); openOpenings();
  }));
  $("#opSave").addEventListener("click", ()=>{ v.openings = read(); save(); closeSheet(); renderDesigner(); });
  openSheet();
}

/* ---- pan, zoom, drag ---- */
const ptrs = new Map();
let drag = null, pinch = null, opdrag = null, mdrag = null;

function toWorld(cx, cy){
  const r = $("#dzStage").getBoundingClientRect(), vb = dz.vb;
  return { x: vb.x + (cx-r.left)/r.width*vb.w, y: vb.y + (cy-r.top)/r.height*vb.h };
}
function onMeasDown(e){
  if (ptrs.size>=2) return;
  e.stopPropagation();
  mdrag = { which: e.currentTarget.dataset.mp };
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
}
function onItemDown(e){
  const v = dzVar(); if (!v || ptrs.size>=2 || dz.tool==="measure") return;
  const id = e.currentTarget.dataset.f, it = v.items.find(i=>i.id===id);
  if (!it) return;
  e.stopPropagation();
  dz.sel = id; dz.selOp = null; renderSelBar();
  $$("#dzSvg .fitem").forEach(g=> g.classList.toggle("sel", g.dataset.f===id));
  const w = toWorld(e.clientX, e.clientY);
  drag = { id, dx: it.x - w.x, dy: it.y - w.y, moved:false };
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
}
/* a door/window drags along its own wall only */
function onOpDown(e){
  const v = dzVar(); if (!v || ptrs.size>=2 || dz.tool==="measure") return;
  const id = e.currentTarget.dataset.op, o = (v.openings||[]).find(x=>x.id===id);
  if (!o) return;
  e.stopPropagation();
  dz.sel = null; dz.selOp = id; renderSelBar(); drawPlan();
  opdrag = { id };
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
}
function moveOpening(o, v, w){
  const horiz = (o.wall==="top"||o.wall==="bottom");
  const along = horiz ? w.x : w.y;
  const wallLen = horiz ? v.w : v.h;
  o.pos = Math.round(clamp(along - o.len/2, 0, Math.max(0, wallLen - o.len)));
}
/* keep a piece within the outer walls; oversized pieces centre instead */
function clampIntoRoom(it, v){
  const A0 = aabb({ ...it, x:0, y:0 });
  const hx = (A0.maxX-A0.minX)/2, hy = (A0.maxY-A0.minY)/2;
  it.x = (hx*2 <= v.w) ? Math.round(clamp(it.x, hx, v.w-hx)) : Math.round(v.w/2);
  it.y = (hy*2 <= v.h) ? Math.round(clamp(it.y, hy, v.h-hy)) : Math.round(v.h/2);
}
function snapItem(it, v){
  const A = aabb(it), gs = [];
  const half = { x:(A.maxX-A.minX)/2, y:(A.maxY-A.minY)/2 };
  const cand = { x:[], y:[] };
  /* walls */
  cand.x.push([0 + half.x, 0], [v.w - half.x, v.w]);
  cand.y.push([0 + half.y, 0], [v.h - half.y, v.h]);
  /* other pieces: align edges */
  for (const o of v.items){
    if (o.id===it.id) continue;
    const B = aabb(o);
    cand.x.push([B.minX - half.x, B.minX], [B.maxX + half.x, B.maxX], [(B.minX+B.maxX)/2, null]);
    cand.y.push([B.minY - half.y, B.minY], [B.maxY + half.y, B.maxY], [(B.minY+B.maxY)/2, null]);
  }
  for (const ax of ["x","y"]){
    let best=null;
    for (const [target, line] of cand[ax]){
      const dd = Math.abs(it[ax]-target);
      if (dd<=SNAP && (!best || dd<best.d)) best={ d:dd, target, line };
    }
    if (best){ it[ax] = best.target; gs.push([ax, best.line]); }
    else it[ax] = Math.round(it[ax]/5)*5;   /* fall back to a 5 cm grid */
  }
  return gs;
}
function onMove(e){
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (pinch && ptrs.size>=2){ doPinch(); return; }
  if (mdrag){
    const w = toWorld(e.clientX, e.clientY), v = dzVar();
    const p = dz.measure[mdrag.which];
    p.x = Math.round(clamp(w.x, -200, v.w+200)); p.y = Math.round(clamp(w.y, -200, v.h+200));
    drawPlan();
    if (e.cancelable) e.preventDefault();
    return;
  }
  if (opdrag){
    const v = dzVar(), o = (v.openings||[]).find(x=>x.id===opdrag.id); if (!o) return;
    moveOpening(o, v, toWorld(e.clientX, e.clientY));
    drawPlan();
    if (e.cancelable) e.preventDefault();
    return;
  }
  if (drag){
    const v = dzVar(), it = v.items.find(i=>i.id===drag.id); if (!it) return;
    const w = toWorld(e.clientX, e.clientY);
    /* a piece cannot be pushed through an outer wall: the travel limit is
       exactly the flush position, so sliding into a wall parks it there.
       Pieces too big for the room stay centred and get flagged instead. */
    const A0 = aabb({ ...it, x:0, y:0 });
    const hx = (A0.maxX-A0.minX)/2, hy = (A0.maxY-A0.minY)/2;
    const nx = w.x + drag.dx, ny = w.y + drag.dy;
    it.x = (hx*2 <= v.w) ? clamp(nx, hx, v.w-hx) : v.w/2;
    it.y = (hy*2 <= v.h) ? clamp(ny, hy, v.h-hy) : v.h/2;
    const guides = snapItem(it, v);
    drag.moved = true;
    dz.warns = planWarnings(v);
    drawPlan(); drawGuides(it, guides, v);
    if (e.cancelable) e.preventDefault();
    return;
  }
  if (pinch===null && ptrs.size===1 && drag===null && panFrom){
    const vb = dz.vb, r = $("#dzStage").getBoundingClientRect();
    const dx = (e.clientX - panFrom.cx)/r.width*vb.w, dy = (e.clientY - panFrom.cy)/r.height*vb.h;
    dz.vb = { ...vb, x: panFrom.vx - dx, y: panFrom.vy - dy };
    drawPlan();
    if (e.cancelable) e.preventDefault();
  }
}
/* live distance-to-wall readout while dragging */
function drawGuides(it, guides, v){
  const A = aabb(it), g = $("#dzGuides"); if (!g) return;
  const fs = dz.vb.w*0.028;
  const L = (x1,y1,x2,y2,val)=>`<line class="gapline" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>
    <text class="gaptxt" x="${(x1+x2)/2}" y="${(y1+y2)/2 - fs*0.25}" style="font-size:${fs}px">${Math.round(val)}</text>`;
  const midY = (A.minY+A.maxY)/2, midX = (A.minX+A.maxX)/2;
  let out = "";
  out += L(0, midY, A.minX, midY, A.minX);
  out += L(A.maxX, midY, v.w, midY, v.w-A.maxX);
  out += L(midX, 0, midX, A.minY, A.minY);
  out += L(midX, A.maxY, midX, v.h, v.h-A.maxY);
  for (const [ax, line] of guides){
    if (line==null) continue;
    out += ax==="x" ? `<line class="guide" x1="${line}" y1="${-40}" x2="${line}" y2="${v.h+40}"/>`
                    : `<line class="guide" x1="${-40}" y1="${line}" x2="${v.w+40}" y2="${line}"/>`;
  }
  g.innerHTML = out;
}
let panFrom = null;
function doPinch(){
  const [a,b] = Array.from(ptrs.values());
  const dist = Math.hypot(a.x-b.x, a.y-b.y);
  const mid  = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
  if (!pinch.dist){ pinch.dist = dist; pinch.mid = mid; pinch.vb = {...dz.vb}; return; }
  const k = clamp(pinch.dist/dist, 0.2, 5);
  const r = $("#dzStage").getBoundingClientRect();
  const nw = clamp(pinch.vb.w * k, 60, 6000), nh = nw * (pinch.vb.h/pinch.vb.w);
  const fx = (pinch.mid.x - r.left)/r.width, fy = (pinch.mid.y - r.top)/r.height;
  const wx = pinch.vb.x + fx*pinch.vb.w, wy = pinch.vb.y + fy*pinch.vb.h;
  dz.vb = { x: wx - fx*nw, y: wy - fy*nh, w:nw, h:nh };
  drawPlan();
}
function onUp(e){
  ptrs.delete(e.pointerId);
  if (ptrs.size<2) pinch = null;
  if (mdrag){ mdrag=null; return; }   /* the ruler is transient — nothing to save */
  if (opdrag){ opdrag=null; save(); renderDesigner(); }
  if (drag){ const v=dzVar(); if (v){ const it=v.items.find(i=>i.id===drag.id);
      if (it){ it.x=Math.round(it.x); it.y=Math.round(it.y); } } drag=null; save(); renderDesigner(); }
  if (ptrs.size===0) panFrom = null;
}

/* ---- export ---- */
async function exportPlan(){
  const v = dzVar(); if (!v) return;
  const src = $("#dzSvg");
  const clone = src.cloneNode(true);
  const g = clone.querySelector("#dzGuides"); if (g) g.remove();
  /* inline the token colours so the exported file stands on its own */
  const cs = getComputedStyle(document.documentElement);
  let css = `.floor{fill:${cs.getPropertyValue("--card-2")}}.wall{fill:none;stroke:${cs.getPropertyValue("--ink")};stroke-width:6}
    .gridline{stroke:${cs.getPropertyValue("--line")};stroke-width:1}
    .dimline{stroke:${cs.getPropertyValue("--line-2")};stroke-width:1.5}
    .dimtxt{fill:${cs.getPropertyValue("--muted")};font-weight:600;text-anchor:middle}
    .op-door{stroke:${cs.getPropertyValue("--brand")};stroke-width:7}
    .op-swing{fill:none;stroke:${cs.getPropertyValue("--brand")};stroke-width:1.5;stroke-dasharray:5 4}
    .op-win{stroke:${cs.getPropertyValue("--d-home")};stroke-width:7}
    .op-hit{display:none}
    .fitem rect,.fitem circle,.fitem path{fill:${cs.getPropertyValue("--card-2")};stroke:${cs.getPropertyValue("--brand")};stroke-width:2}
    .fitem.under rect,.fitem.under circle{fill:${cs.getPropertyValue("--card-3")};stroke:${cs.getPropertyValue("--coral")};stroke-dasharray:7 5}
    .fitem text{fill:${cs.getPropertyValue("--ink")};font-weight:700;text-anchor:middle}
    .fitem .fdim{fill:${cs.getPropertyValue("--muted")};font-weight:600}
    text{font-family:Rubik,Arial,sans-serif}`;
  const st = document.createElementNS("http://www.w3.org/2000/svg","style");
  st.textContent = css; clone.insertBefore(st, clone.firstChild);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  const pad = 60;
  clone.setAttribute("viewBox", `${-pad} ${-pad} ${v.w+pad*2} ${v.h+pad*2}`);
  const W = 1400, H = Math.round(W*(v.h+pad*2)/(v.w+pad*2));
  clone.setAttribute("width", W); clone.setAttribute("height", H);
  const svgText = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; }).catch(()=>{});
  const cv = document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);
  try{ ctx.drawImage(img,0,0,W,H); }catch(e){ toast("הייצוא נכשל"); return; }
  const blob = await new Promise(r=> cv.toBlob(r, "image/png"));
  if (!blob){ toast("הייצוא נכשל"); return; }
  const fname = `${roomName(dz.room)}-${dzVar().name}.png`.replace(/\s+/g,"-");
  const file = new File([blob], fname, { type:"image/png" });
  /* the share sheet is the reliable "save image" path on iOS */
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file] }); return; }catch(e){ if (e && e.name==="AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
  toast("התוכנית נשמרה כתמונה");
}

/* ---- designer menu ---- */
function openDzMenu(){
  const p = dzPlan();
  setHead(`<h3>אפשרויות</h3><div class="meta">${esc(roomName(dz.room))} · ${esc(dzVar().name)}</div>`);
  $("#shExtra").innerHTML = "";
  $("#shBody").innerHTML = `
    <button class="btn ghost block" id="mSize">שינוי מידות החדר</button>
    <button class="btn ghost block" id="mImg" style="margin-top:9px">שמירת תמונה של התוכנית</button>
    ${ p.variants.length>1 ? `<button class="btn ghost block" id="mDelVar" style="margin-top:9px;color:var(--d-buy)">מחיקת הגרסה הזו</button>`:"" }
    <button class="btn ghost block" id="mDelPlan" style="margin-top:9px;color:var(--d-buy)">מחיקת התוכנית של החדר</button>`;
  $("#mSize").addEventListener("click", ()=> openRoomSetup(dz.room, false));
  $("#mImg").addEventListener("click", ()=>{ closeSheet(); setTimeout(exportPlan, 250); });
  const dv = $("#mDelVar");
  if (dv) dv.addEventListener("click", ()=>{
    p.variants.splice(dz.vi,1); dz.vi = 0; p.active = 0; save(); closeSheet(); dzFit(); toast("הגרסה נמחקה");
  });
  let armed=false;
  $("#mDelPlan").addEventListener("click", e=>{
    if (!armed){ armed=true; e.currentTarget.textContent="לחץ שוב למחיקת התוכנית"; return; }
    delete state.plans[dz.room]; save(); closeSheet(); closeDesigner(); toast("התוכנית נמחקה");
  });
  openSheet();
}

/* ---- designer wiring ---- */
$("#dzBack").addEventListener("click", closeDesigner);
$("#dzFit").addEventListener("click", dzFit);
$("#dzMenu").addEventListener("click", openDzMenu);
(function(){
  const stage = $("#dzStage");
  stage.addEventListener("pointerdown", e=>{
    ptrs.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if (ptrs.size===2){ pinch = { dist:0 }; drag = null; opdrag = null; mdrag = null; panFrom = null; return; }
    if (drag || opdrag || mdrag) return;
    if (e.target.closest(".fitem") || e.target.closest(".op") || e.target.closest(".mpt")) return;   /* handled by their own downs */
    dz.sel = null; dz.selOp = null; renderSelBar(); drawPlan();
    panFrom = { cx:e.clientX, cy:e.clientY, vx:dz.vb.x, vy:dz.vb.y };
  });
  window.addEventListener("pointermove", onMove, { passive:false });
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  window.addEventListener("resize", ()=>{ if (document.body.classList.contains("designing")) dzFit(); });
})();

/* ============================================================ RENDER + EVENTS */
function renderAll(){
  renderHeader(); renderHero(); renderRoomCards(); renderMoney(); renderDesignList();
  if (uiRoom) renderRoom();
  if (genOpen) renderGeneralBody();
}
$$(".tabbar [data-v]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    uiView = btn.dataset.v;
    $$(".tabbar [data-v]").forEach(b=> b.setAttribute("aria-selected", String(b===btn)));
    $$(".view").forEach(v=> v.classList.toggle("on", v.id === "v-"+uiView));
    renderHeader(); window.scrollTo({ top:0, behavior:"smooth" });
  });
});
$$("#roomPills button").forEach(b=>{
  b.addEventListener("click", ()=>{
    roomFilter = b.dataset.f;
    $$("#roomPills button").forEach(x=> x.setAttribute("aria-selected", String(x===b)));
    renderRoomCards();
  });
});
$("#fab").addEventListener("click", ()=>{
  if (uiView === "design") { toast("בחר חדר כדי להתחיל לעצב"); return; }
  uiRoom ? addItemTo(uiRoom) : openAddSheet();
});
$("#settingsTab").addEventListener("click", openSettings);
$("#scrim").addEventListener("click", closeSheet);
$("#shClose").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if (e.key==="Escape") closeSheet(); });

const root = document.documentElement;
$("#themeBtn").addEventListener("click", ()=>{
  const cur = root.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur==="dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
  root.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
});
try{ const th = localStorage.getItem(THEME_KEY); if (th) root.setAttribute("data-theme", th); }catch(e){}

state = normalize(load());
renderAll();
save();
})();
</script>
