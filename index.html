<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הבית החדש">
<title>הבית החדש</title>

<!-- Home-screen icon. iOS needs a real opaque PNG here; it ignores SVG and
     data: URIs, and renders any transparency as black. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS — fitness-inspired: mint green + peach, Rubik, soft cards.
   Two colour tiers: pastel/brand surfaces, and a validated data
   tier (home/buy/done) for anything that encodes a status.
   ============================================================ */
:root{
  direction: rtl;

  --bg1:   #E7F1EB;
  --bg2:   #FBE9DC;
  --app:   #F3F7F4;
  --card:  #FFFFFF;
  --card-2:#F1F5F2;
  --card-3:#E7EEEA;
  --line:  #E7EDEA;
  --line-2:#CFDAD3;
  --ink:   #26332C;
  --ink-2: #55625B;
  --muted: #6E7A72;

  --brand:    #17A085;
  --brand-2:  #37BFA2;
  --brand-ink:#FFFFFF;
  --coral:    #EE8B6E;

  /* data tier — validated for CVD, light surface */
  --d-home: #6D79D4;
  --d-buy:  #CB5340;
  --d-done: #0E8C72;

  --sh-sm: 0 2px 8px rgba(33,53,43,.06);
  --sh:    0 10px 26px rgba(33,53,43,.08), 0 2px 6px rgba(33,53,43,.05);
  --sh-lg: 0 -14px 44px rgba(33,53,43,.16);
  --sh-fab:0 10px 22px rgba(23,160,133,.42);

  --ui: "Rubik","Assistant","Heebo","Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;

  --r-card: 24px;
  --r-sm:   15px;
  --r-pill: 999px;
  --appw:   470px;
  --navh:   74px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:   #0F1714;
    --bg2:   #141019;
    --app:   #101714;
    --card:  #18211D;
    --card-2:#1F2925;
    --card-3:#273330;
    --line:  #273330;
    --line-2:#3A4A44;
    --ink:   #E9F1EC;
    --ink-2: #B7C4BC;
    --muted: #7F8D85;

    --brand:    #2CC0A0;
    --brand-2:  #33D6B2;
    --brand-ink:#08130F;
    --coral:    #F0956F;

    --d-home: #7B85DA;
    --d-buy:  #D66E54;
    --d-done: #1BA083;

    --sh-sm: 0 2px 8px rgba(0,0,0,.4);
    --sh:    0 10px 26px rgba(0,0,0,.5);
    --sh-lg: 0 -14px 44px rgba(0,0,0,.6);
    --sh-fab:0 10px 22px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg1:   #0F1714;
  --bg2:   #141019;
  --app:   #101714;
  --card:  #18211D;
  --card-2:#1F2925;
  --card-3:#273330;
  --line:  #273330;
  --line-2:#3A4A44;
  --ink:   #E9F1EC;
  --ink-2: #B7C4BC;
  --muted: #7F8D85;

  --brand:    #2CC0A0;
  --brand-2:  #33D6B2;
  --brand-ink:#08130F;
  --coral:    #F0956F;

  --d-home: #7B85DA;
  --d-buy:  #D66E54;
  --d-done: #1BA083;

  --sh-sm: 0 2px 8px rgba(0,0,0,.4);
  --sh:    0 10px 26px rgba(0,0,0,.5);
  --sh-lg: 0 -14px 44px rgba(0,0,0,.6);
  --sh-fab:0 10px 22px rgba(0,0,0,.55);
}

/* ============================================================ */
*{ box-sizing:border-box; }
html,body{ min-height:100%; }
body{
  margin:0; color: var(--ink); font-family: var(--ui);
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  background:
    linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%) fixed;
}
h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
button{ font:inherit; color:inherit; cursor:pointer; border:0; background:transparent; }
input,select{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:8px; }
.n{ font-variant-numeric: tabular-nums; }

.app{
  max-width: var(--appw); margin:0 auto; min-height:100vh; min-height:100dvh; position:relative;
  padding: 0 16px calc(var(--navh) + 26px + env(safe-area-inset-bottom));
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
}
@media (min-width: 900px){
  .app{ box-shadow: 0 30px 90px rgba(33,53,43,.14); background: linear-gradient(160deg, var(--bg1), var(--bg2)); }
}

/* ---------- header ---------- */
.apphead{ padding: 20px 0 8px; position:sticky; top:0; z-index:30;
  background: linear-gradient(180deg, var(--bg1) 60%, transparent); }
.ah-top{ display:flex; align-items:center; gap:10px; }
.ah-date{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); margin-inline-end:auto; font-weight:500; }
.ah-btn{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
  background: var(--card); box-shadow: var(--sh-sm); color: var(--ink-2); }
.ah-btn:active{ transform: scale(.94); }
.ah-title{ margin-top:12px; }
.ah-title h1{ font-size:28px; font-weight:800; line-height:1.1; }
.ah-title .sub{ font-size:13px; color:var(--muted); margin-top:3px; font-weight:500; }

/* ---------- card ---------- */
.card{ background: var(--card); border-radius: var(--r-card); box-shadow: var(--sh); padding:18px; margin-bottom:15px; }
.card-h{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.card-h h3{ font-size:16.5px; font-weight:700; }
.card-h .side{ margin-inline-start:auto; font-size:12.5px; color:var(--muted); font-weight:600; }
.lede{ font-size:12.5px; color:var(--muted); margin:-6px 0 14px; font-weight:500; }

/* ---------- ring ---------- */
.ring{ position:relative; flex:none; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .trk{ fill:none; stroke: var(--card-3); }
.ring .arc{ fill:none; stroke-linecap:round; transition: stroke-dasharray .6s cubic-bezier(.3,.8,.4,1); }
.ring .lab{ position:absolute; inset:0; display:grid; place-items:center; font-weight:800;
  font-variant-numeric:tabular-nums; letter-spacing:-.03em; }

/* ---------- rooms hero (Today's Progress style) ---------- */
.hero{ display:flex; align-items:center; gap:18px; }
.hero .ring{ width:96px; height:96px; }
.hero .ring .lab{ font-size:21px; color: var(--brand); }
.hero .ring .lab small{ display:block; font-size:9.5px; font-weight:600; color:var(--muted); letter-spacing:.04em; margin-top:-2px; }
.hero-stats{ flex:1; min-width:0; display:flex; flex-direction:column; gap:11px; }
.hstat{ display:flex; align-items:center; gap:9px; font-size:13.5px; }
.hstat .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.hstat .nm{ color: var(--ink-2); font-weight:500; }
.hstat .v{ margin-inline-start:auto; font-weight:700; font-variant-numeric:tabular-nums; }
.hstat .v small{ color: var(--muted); font-weight:500; font-size:11.5px; margin-inline-start:3px; }

/* ---------- pills ---------- */
.pills{ display:flex; gap:8px; margin: 4px 0 15px; }
.pills button{ flex:1; border-radius: var(--r-pill); padding:10px 6px; font-size:13.5px; font-weight:600;
  color: var(--ink-2); background: var(--card); box-shadow: var(--sh-sm); transition: background .16s, color .16s; }
.pills button[aria-selected="true"]{ background: var(--brand); color: var(--brand-ink); box-shadow: var(--sh-fab); }

/* ---------- room cards ---------- */
.rcard{ display:flex; align-items:center; gap:15px; width:100%; text-align:start;
  background: var(--card); border-radius: var(--r-card); box-shadow: var(--sh); padding:16px; margin-bottom:13px; }
.rcard:active{ transform: scale(.99); }
.rcard .ring{ width:60px; height:60px; }
.rcard .ring .lab{ font-size:14px; color: var(--ink); }
.rcard .t{ flex:1; min-width:0; }
.rcard h4{ font-size:17px; font-weight:700; margin-bottom:8px; }
.rcard .foot{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.chipn{ display:inline-flex; align-items:center; gap:5px; background: var(--card-2); border-radius: var(--r-pill);
  padding:4px 10px; font-size:12px; font-weight:600; color: var(--ink-2); font-variant-numeric:tabular-nums; }
.chipn i{ width:7px; height:7px; border-radius:50%; flex:none; }
.rcard .chev{ color: var(--line-2); flex:none; }
.addroom{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
  background: transparent; border:2px dashed var(--line-2); border-radius: var(--r-card);
  padding:16px; margin-bottom:13px; font-size:14.5px; font-weight:700; color: var(--ink-2); }
.addroom:active{ transform: scale(.99); }
.addroom:hover{ border-color: var(--brand); color: var(--brand); }

/* ---------- money: budget hero (Calorie-Goal style) ---------- */
.bhero .bh-top{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; }
.bh-label{ font-size:13px; color:var(--muted); font-weight:600; }
.bh-big{ font-size:30px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.05; margin-top:2px; }
.bh-side{ font-size:13px; color:var(--ink-2); font-weight:700; font-variant-numeric:tabular-nums; padding-bottom:4px; }
.bh-side .over{ color: var(--d-buy); }
.bh-bar{ height:14px; border-radius:var(--r-pill); background: var(--card-3); display:flex; gap:2px; overflow:hidden; }
.bh-bar i{ height:100%; }
.bh-bar .paid{ background: var(--d-done); }
.bh-bar .plan{ background: var(--coral); }
.bh-bar .over{ background: var(--d-buy); }
.bh-legend{ display:flex; gap:16px; margin-top:12px; font-size:12px; color:var(--ink-2); font-weight:500; flex-wrap:wrap; }
.bh-legend span{ display:inline-flex; align-items:center; gap:6px; }
.bh-legend i{ width:9px; height:9px; border-radius:3px; flex:none; }

/* ---------- money: status rings (macro style) ---------- */
.rings3{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }
.mring{ display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; }
.mring .ring{ width:74px; height:74px; }
.mring .ring .lab{ font-size:15px; }
.mring .ml{ font-size:12.5px; font-weight:600; color: var(--ink-2); }
.mring .mv{ font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; color: var(--ink); }

/* ---------- money: per-room rows ---------- */
.mrow{ display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
.mrow:last-child{ border-bottom:0; }
.mrow .t{ flex:1; min-width:0; }
.mrow .nm{ font-size:14px; font-weight:600; margin-bottom:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mrow .track{ position:relative; height:8px; border-radius:var(--r-pill); background: var(--card-3); display:flex; gap:2px; overflow:hidden; }
.mrow .track i{ height:100%; }
.mrow .track .paid{ background: var(--d-done); }
.mrow .track .plan{ background: var(--coral); }
.mrow .bmark{ position:absolute; top:-2px; bottom:-2px; width:2px; background: var(--ink); opacity:.55; border-radius:2px; }
.mrow .amt{ text-align:start; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; flex:none; min-width:74px; }
.mrow .amt small{ display:block; font-size:11px; color:var(--muted); font-weight:600; }
.mrow .amt .over{ color: var(--d-buy); }

/* ---------- bottom nav ---------- */
.tabbar{ position:fixed; bottom:0; inset-inline:0; min-height: var(--navh); z-index:40;
  max-width: var(--appw); margin:0 auto;
  background: var(--card); border-radius: 28px 28px 0 0; box-shadow: 0 -6px 26px rgba(33,53,43,.12);
  display:flex; align-items:center; justify-content:space-around; padding: 0 14px env(safe-area-inset-bottom); }
.tabbar button{ display:grid; place-items:center; gap:4px; color: var(--muted); padding:8px 14px; border-radius:16px; }
.tabbar button .cap{ font-size:11px; font-weight:600; }
.tabbar button[aria-selected="true"]{ color: var(--brand); }
.tabbar button.fab{ width:60px; height:60px; border-radius:50%;
  background: linear-gradient(145deg, var(--brand-2), var(--brand)); color: var(--brand-ink);
  display:grid; place-items:center; box-shadow: var(--sh-fab); margin-top:-24px; flex:none; }
.tabbar button.fab:active{ transform: scale(.95); }

/* ---------- sheet ---------- */
.scrim{ position:fixed; inset:0; background: rgba(20,30,25,.5); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s; }
.scrim.on{ opacity:1; pointer-events:auto; }
.sheet{ position:fixed; inset-inline:0; bottom:0; z-index:51; max-width: var(--appw); margin:0 auto;
  background: var(--card); border-radius: 28px 28px 0 0; box-shadow: var(--sh-lg);
  max-height: 92vh; max-height: 92dvh; display:flex; flex-direction:column;
  transform: translateY(100%); transition: transform .28s cubic-bezier(.3,.85,.35,1); }
.sheet.on{ transform: translateY(0); }
.sh-drag{ padding-top:10px; touch-action:none; cursor:grab; flex:none; }
.sh-drag:active{ cursor:grabbing; }
.sh-grab{ width:44px; height:5px; border-radius:3px; background: var(--line-2); margin:0 auto; }
.sh-head{ padding: 12px 20px 14px; display:flex; align-items:flex-start; gap:13px; flex:none; touch-action:none; }
.sh-head .t{ flex:1; min-width:0; }
.sh-head h3{ font-size:21px; font-weight:800; }
.sh-head .meta{ font-size:12.5px; color:var(--muted); margin-top:3px; font-weight:500; }
.sh-close{ width:36px; height:36px; border-radius:50%; background: var(--card-2); display:grid; place-items:center; flex:none; color:var(--ink-2); }
.sh-stats{ display:flex; gap:9px; padding:0 20px 14px; flex:none; }
.sh-stats div{ flex:1; background: var(--card-2); border-radius: var(--r-sm); padding:11px 12px; }
.sh-stats .l{ font-size:10.5px; color:var(--muted); font-weight:600; }
.sh-stats .v{ font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px; }
.sh-budget{ display:flex; align-items:center; gap:9px; padding:0 20px 14px; font-size:12.5px; color:var(--ink-2); font-weight:600; flex:none; flex-wrap:wrap; }
.sh-budget input{ width:100px; background: var(--card-2); border:0; border-radius:12px; padding:8px 11px; font-variant-numeric:tabular-nums; font-size:14px; }
.sh-body{ overflow-y:auto; flex:1; padding: 2px 20px calc(22px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch; }

/* editable room title */
.sh-title-input{ width:100%; background:transparent; border:0; padding:2px 0; font-size:21px; font-weight:800;
  letter-spacing:-.01em; color: var(--ink); border-bottom:2px dashed var(--line-2); }
.sh-title-input:focus{ border-bottom-color: var(--brand); outline:none; }
.sh-title-hint{ font-size:11px; color:var(--muted); margin-top:4px; font-weight:500; }

/* ---------- item row ---------- */
.item{ display:flex; align-items:flex-start; gap:13px; padding:14px 0; border-bottom:1px solid var(--line); }
.item:last-child{ border-bottom:0; }
.tick{ width:26px; height:26px; border-radius:9px; border:2px solid var(--line-2); flex:none; margin-top:1px;
  display:grid; place-items:center; color:transparent; transition: background .16s, border-color .16s, color .16s; }
.item.is-done .tick{ background: var(--d-done); border-color: var(--d-done); color:#fff; }
.item.is-home .tick{ background: var(--d-home); border-color: var(--d-home); color:#fff; }
.item .body{ flex:1; min-width:0; }
.item .nm{ width:100%; background:transparent; border:0; padding:0; font-size:15px; font-weight:600; border-bottom:1px dashed transparent; }
.item .nm:hover, .item .nm:focus{ border-bottom-color: var(--line-2); }
.item.is-done .nm{ text-decoration: line-through; color: var(--muted); }
.item.is-home .nm{ color: var(--ink-2); }
.item .sub{ display:flex; align-items:center; gap:9px; margin-top:8px; flex-wrap:wrap; font-size:12px; color:var(--muted); font-weight:500; }
.item .price{ width:80px; background: var(--card-2); border:0; border-radius:10px; padding:5px 9px; font-size:13px; font-variant-numeric:tabular-nums; }
.item .del{ color: var(--muted); font-size:20px; line-height:1; padding:2px 4px; flex:none; }
.item .del:active{ color: var(--d-buy); }
.seg{ display:inline-flex; background: var(--card-2); border-radius: var(--r-pill); padding:3px; margin-top:10px; }
.seg button{ border-radius: var(--r-pill); padding:6px 12px; font-size:12px; font-weight:600; color: var(--muted); }
.seg button[aria-pressed="true"]{ color:#fff; }
.seg button[data-s="home"][aria-pressed="true"]{ background: var(--d-home); }
.seg button[data-s="buy"][aria-pressed="true"]{  background: var(--d-buy); }
.seg button[data-s="done"][aria-pressed="true"]{ background: var(--d-done); }

.btn{ background: var(--brand); color: var(--brand-ink); border-radius: var(--r-pill); padding:12px 20px; font-size:14.5px; font-weight:700; }
.btn:active{ transform: scale(.98); }
.btn.ghost{ background: var(--card-2); color: var(--ink); }
.btn.sm{ padding:8px 15px; font-size:12.5px; }
.btn.block{ width:100%; }

.settings-row{ display:flex; align-items:center; gap:10px; padding:13px 0; border-bottom:1px solid var(--line); font-size:14px; font-weight:500; }
.settings-row:last-of-type{ border-bottom:0; }
.settings-row .lbl{ flex:1; }
.settings-row input{ width:140px; background: var(--card-2); border:0; border-radius:12px; padding:9px 12px; font-variant-numeric:tabular-nums; text-align:start; }

@media (pointer: coarse){
  input, select, .item .nm, .sh-title-input{ font-size:16px; }
  .item .price{ width:88px; }
}

.view{ display:none; }
.view.on{ display:block; animation: rise .3s cubic-bezier(.3,.8,.4,1); }
@keyframes rise{ from{ opacity:0; transform: translateY(10px); } }

.toast{ position:fixed; bottom: calc(var(--navh) + 18px + env(safe-area-inset-bottom)); inset-inline:0; margin:auto;
  width:max-content; max-width:86vw; background: var(--ink); color: var(--card); padding:11px 18px;
  border-radius: var(--r-pill); font-size:13.5px; font-weight:600; z-index:80; opacity:0; transform: translateY(10px);
  transition: opacity .2s, transform .2s; pointer-events:none; box-shadow: var(--sh); }
.toast.on{ opacity:1; transform: translateY(0); }
.empty{ text-align:center; color:var(--muted); font-size:13.5px; padding:36px 12px; font-weight:500; }

@media (prefers-reduced-motion: reduce){ *{ transition-duration:.01ms !important; animation-duration:.01ms !important; } }
</style>
</head>
<body>

<div class="app">
  <header class="apphead">
    <div class="ah-top">
      <span class="ah-date">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <span id="hdDate">—</span>
      </span>
      <button class="ah-btn" id="settingsBtn" aria-label="הגדרות">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19l-.1.1A2 2 0 1 1 5 16.3l.1-.1A1.6 1.6 0 0 0 4 13.6H4a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 5.2 7l-.1-.1A2 2 0 1 1 7.9 4.1L8 4.2a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 17.4 4.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/></svg>
      </button>
      <button class="ah-btn" id="themeBtn" aria-label="החלפת מצב תצוגה">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>

      <h1 id="hdTitle">הבית החדש</h1>

  </header>

  <!-- ============ ROOMS ============ -->
  <section class="view on" id="v-rooms">
    <div class="card hero" id="hero"></div>
    <div class="pills" id="roomPills">
      <button aria-selected="true" data-f="all">הכל</button>
      <button aria-selected="false" data-f="open">נותרו</button>

  <!-- ============ MONEY ============ -->
  <section class="view" id="v-money">
    <div class="card bhero" id="budgetHero"></div>
    <div class="card">
      <div class="card-h"><h3>איך מתחלק הכסף</h3></div>
      <div class="rings3" id="statusRings"></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>לפי חדר</h3></div>
      <div id="roomRows"></div>
    </div>
  </section>

  <nav class="tabbar" role="tablist">
    <button role="tab" data-v="rooms" aria-selected="true">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span class="cap">חדרים</span>
    </button>
    <button class="fab" id="fab" aria-label="הוספת פריט">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button role="tab" data-v="money" aria-selected="false">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 5-7 4 5"/><path d="M3 21h18"/></svg>
      <span class="cap">כספים</span>
    </button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>

<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sh-drag" id="shDrag"><div class="sh-grab"></div></div>
  <div class="sh-head" id="shHead">
    <div class="t" id="shT"></div>
    <button class="sh-close" id="shClose" aria-label="סגירה">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="shExtra"></div>
  <div class="sh-body" id="shBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
   ROOMS — default set (names only; editable and deletable)
   ============================================================ */
const DEFAULT_ROOMS = [
  ["balcony","מרפסת"], ["living","סלון"], ["kitchen","מטבח"],
  ["bed_itai","חדר שינה איתי"], ["bed_elad","חדר שינה אלעד"], ["treatment","חדר טיפולים"],
  ["master","חדר שינה הורים"], ["balcony_small","מרפסת קטנה"],
  ["ensuite","מקלחת + שירותים הורים"], ["bath","מקלחת + שירותים"]
];
const roomById = id => state.rooms.find(r=>r.id===id);
const roomName = id => { const r = roomById(id); return r ? r.name : "חדר"; };

/* [name, estimate ₪, default status] */
const SEED = {
  balcony: [
    ["סט ישיבה לחוץ",3500,"buy"], ["שולחן מרפסת",900,"buy"], ["סוכך או הצללה",1800,"buy"],
    ["אדניות וצמחייה",700,"buy"], ["תאורת חוץ",500,"buy"], ["שטיח חוץ",400,"buy"]
  ],
  living: [
    ["ספה שלושה מושבים",6000,"buy"], ["כורסה",1800,"buy"], ["שולחן סלון",900,"buy"],
    ["מזנון טלוויזיה",1500,"buy"], ["טלוויזיה 55 אינץ׳",2800,"home"], ["מקרן קול",900,"home"],
    ["שטיח",1200,"buy"], ["וילונות ומסילה",1800,"buy"], ["גוף תאורה מרכזי",800,"buy"],
    ["מנורת עמידה",450,"home"], ["כריות נוי וטקסטיל",400,"home"], ["מזגן עילי",4500,"buy"],
    ["שולחן אוכל",2500,"buy"], ["שישה כיסאות",3000,"buy"]
  ],
  kitchen: [
    ["מקרר",4500,"buy"], ["תנור בילט אין",2200,"buy"], ["כיריים",1800,"buy"],
    ["קולט אדים",1200,"buy"], ["מדיח כלים",2500,"buy"], ["מיקרוגל",500,"home"],
    ["מיקסר ובלנדר",600,"home"], ["קומקום חשמלי",250,"home"], ["טוסטר אובן",400,"home"],
    ["סירים ומחבתות",1200,"home"], ["כלי אוכל וסכו״ם",1500,"home"],
    ["ברז מטבח ומסנן מים",900,"buy"], ["3 שרפרפים לאי",1200,"buy"], ["תאורה מעל האי",700,"buy"]
  ],
  bed_itai: [
    ["מיטה",1800,"buy"], ["מזרן",1500,"buy"], ["ארון בגדים",3500,"buy"],
    ["שולחן כתיבה",900,"buy"], ["כיסא",700,"buy"], ["שידה",500,"buy"],
    ["וילון",700,"buy"], ["מזגן",3200,"buy"], ["תאורה",400,"buy"]
  ],
  bed_elad: [
    ["מיטה",1800,"buy"], ["מזרן",1500,"buy"], ["ארון בגדים",3500,"buy"],
    ["שולחן כתיבה",900,"buy"], ["כיסא",700,"buy"], ["שידה",500,"buy"],
    ["וילון",700,"buy"], ["מזגן",3200,"buy"], ["תאורה",400,"buy"]
  ],
  treatment: [
    ["מיטת טיפולים",2500,"buy"], ["שידת אחסון",1200,"buy"], ["כיסא מטפל",800,"buy"],
    ["מדפים וארונית",900,"buy"], ["תאורה רכה",500,"buy"], ["וילון",700,"buy"], ["מזגן",3200,"buy"]
  ],
  master: [
    ["מיטה זוגית ובסיס",4500,"buy"], ["מזרן זוגי",4000,"buy"], ["שתי שידות לילה",1200,"buy"],
    ["ארון הזזה",6000,"buy"], ["מנורות קריאה",500,"buy"], ["מצעים וכריות",1200,"buy"],
    ["וילון האפלה",1200,"buy"], ["מזגן",3500,"buy"], ["שטיח",700,"buy"]
  ],
  balcony_small: [
    ["מכונת כביסה",2500,"home"], ["מייבש כביסה",2800,"buy"],
    ["ארונית שירות",1200,"buy"], ["מתלה כביסה",300,"home"], ["כיור שירות",800,"buy"]
  ],
  ensuite: [
    ["ארון אמבטיה עם כיור",2500,"buy"], ["מראה עם תאורה",800,"buy"], ["מקלחון זכוכית",2400,"buy"],
    ["ברז וראש מקלחת",1100,"buy"], ["אסלה תלויה וסוללת הדחה",1800,"buy"], ["אביזרי תלייה",400,"home"]
  ],
  bath: [
    ["ארון עם כיור",2200,"buy"], ["מראה",600,"buy"], ["מקלחון או אמבטיה",2000,"buy"],
    ["ברזים",1200,"buy"], ["אסלה תלויה וסוללת הדחה",1800,"buy"], ["אביזרים",300,"home"]
  ]
};

const STATUS = {
  home: { label:"לוקחים מהבית", short:"מהבית", v:"home", col:"var(--d-home)" },
  buy:  { label:"צריך לקנות",   short:"לקנות", v:"buy",  col:"var(--d-buy)"  },
  done: { label:"נקנה",         short:"נקנה",  v:"done", col:"var(--d-done)" }
};

/* ============================================================ HELPERS */
const $  = (s,c)=> (c||document).querySelector(s);
const $$ = (s,c)=> Array.from((c||document).querySelectorAll(s));
const nf = new Intl.NumberFormat("he-IL",{ maximumFractionDigits:0 });
const cf = new Intl.NumberFormat("he-IL",{ style:"currency", currency:"ILS", maximumFractionDigits:0 });
const money  = v => cf.format(Math.round(v||0));
const moneyN = v => cf.format(Math.round(v||0)).replace(/\s?₪/,"");
const esc = s => String(s??"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const DAY = 86400000;
const today = ()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));

/* ============================================================ STATE */
const KEY = "newhome.plan.v3";
const THEME_KEY = "newhome.theme";
let state, uiRoom = null, uiView = "rooms", roomFilter = "all";

function defaultMoveIn(){ const d=new Date(); d.setMonth(d.getMonth()+9); return d.toISOString().slice(0,10); }
function seedState(){
  let n=0; const items=[];
  const rooms = DEFAULT_ROOMS.map(([id,name])=>({ id, name }));
  for (const r of rooms)
    for (const [name, est, st] of (SEED[r.id]||[]))
      items.push({ id:"i"+(++n), room:r.id, name, est, actual:null, status:st });
  const roomBudgets = {};
  for (const r of rooms)
    roomBudgets[r.id] = Math.round(items.filter(i=>i.room===r.id).reduce((a,i)=>a+i.est,0)/500)*500;
  return { v:3, moveIn: defaultMoveIn(), budget:150000, rooms, roomBudgets, items, seq:n };
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) return s; }catch(e){}
  return seedState();
}
function normalize(s){
  const out = seedState();
  out.moveIn = typeof s.moveIn === "string" ? s.moveIn : out.moveIn;
  out.budget = Number.isFinite(+s.budget) ? +s.budget : out.budget;
  out.seq = +s.seq || 0;

  let rooms = Array.isArray(s.rooms)
    ? s.rooms.filter(r=> r && typeof r.id==="string").map(r=>({ id:r.id, name:String(r.name||"חדר").trim() || "חדר" }))
    : out.rooms;
  if (!rooms.length) rooms = out.rooms;
  const known = new Set(rooms.map(r=>r.id));
  const orphaned = new Set((s.items||[]).map(i=>i&&i.room).filter(id=> id && !known.has(id)));
  for (const id of orphaned){ rooms.push({ id, name:"חדר" }); known.add(id); }
  out.rooms = rooms;

  out.roomBudgets = {};
  for (const r of rooms) out.roomBudgets[r.id] =
    (s.roomBudgets && Number.isFinite(+s.roomBudgets[r.id])) ? +s.roomBudgets[r.id] : 0;

  out.items = (s.items||[]).filter(i=> i && known.has(i.room)).map((i,ix)=>({
    id: i.id || ("i"+ix+"_"+Date.now().toString(36)),
    room: i.room, name: String(i.name||"פריט"),
    est: Math.max(0, +i.est||0),
    actual: i.actual==null ? null : Math.max(0, +i.actual||0),
    status: STATUS[i.status] ? i.status : "buy"
  }));
  return out;
}
let saveTimer;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }, 200); }
function commit(){ save(); renderAll(); }

/* ---- derived ---- */
const moveInDate = ()=>{ const d = new Date(state.moveIn+"T00:00:00"); return isNaN(d) ? null : d; };
const daysTo = d => d ? Math.round((d - today())/DAY) : null;
const roomItems = id => state.items.filter(i=>i.room===id);
function totals(items){
  let paid=0, planned=0, saved=0, nHome=0, nBuy=0, nDone=0;
  for (const i of items){
    if (i.status==="home"){ saved += i.est; nHome++; }
    else if (i.status==="done"){ paid += (i.actual!=null?i.actual:i.est); nDone++; }
    else { planned += i.est; nBuy++; }
  }
  return { paid, planned, saved, projected:paid+planned, nHome, nBuy, nDone, n:items.length };
}
function readiness(id){ const its = roomItems(id); return its.length ? its.filter(i=>i.status!=="buy").length / its.length : 0; }
const projected = i => i.status==="home" ? 0 : (i.status==="done" ? (i.actual!=null?i.actual:i.est) : i.est);

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2100); }

/* ---- ring svg ---- */
function ring(pct, color){
  const R=42, C=2*Math.PI*R, p=clamp(pct,0,100);
  const arc = p>0.4 ? `<circle class="arc" cx="50" cy="50" r="${R}" stroke="${color}" stroke-width="9" stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}"/>` : "";
  return `<svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="${R}" stroke-width="9"/>${arc}</svg>
    <span class="lab">${Math.round(p)}%</span>`;
}

/* ============================================================ HEADER */
const VIEW_TITLE = {
  rooms: ["הבית החדש", ()=> nf.format(state.rooms.length) + " חדרים · " + nf.format(state.items.length) + " פריטים"],
  money: ["כספים",     ()=> "תקציב " + money(state.budget)]
};
function renderHeader(){
  const m = moveInDate(), d = daysTo(m);
  $("#hdDate").textContent = m
    ? "כניסה " + m.toLocaleDateString("he-IL",{ day:"numeric", month:"long", year:"numeric" })
      + (d!=null ? (d>=0 ? " · בעוד " + nf.format(d) + " ימים" : " · עברו " + nf.format(-d) + " ימים") : "")
    : "לא נקבע תאריך כניסה";
  const [t, sub] = VIEW_TITLE[uiView];
  $("#hdTitle").textContent = t;
  $("#hdSub").textContent = sub();
}

/* ============================================================ ROOMS: HERO */
function renderHero(){
  const t = totals(state.items);
  const settled = state.items.length ? Math.round((t.nDone + t.nHome) / state.items.length * 100) : 0;
  const left = state.budget - t.projected;
  const line = (col, nm, val, note)=>`
    <div class="hstat"><span class="dot" style="background:${col}"></span>
      <span class="nm">${esc(nm)}</span>
      <span class="v">${val}${note?`<small>${esc(note)}</small>`:""}</span></div>`;
  $("#hero").innerHTML = `
    <div class="ring">${ring(settled, "var(--brand)")}</div>
    <div class="hero-stats">
      ${line("var(--d-buy)","צריך לקנות", nf.format(t.nBuy), money(t.planned))}
      ${line("var(--d-done)","נקנה", nf.format(t.nDone), money(t.paid))}
      ${line("var(--d-home)","מהבית", nf.format(t.nHome), money(t.saved))}
      ${line(left>=0?"var(--brand)":"var(--d-buy)", left>=0?"נשאר בתקציב":"חריגה", money(Math.abs(left)))}
    </div>`;
}

/* ============================================================ ROOMS: CARDS */
function renderRoomCards(){
  const rows = state.rooms.filter(r=>{
    if (roomFilter==="all") return true;
    const done = readiness(r.id) === 1 && roomItems(r.id).length > 0;
    return roomFilter==="done" ? done : !done;
  });
  const cards = rows.map(r=>{
    const t = totals(roomItems(r.id)), pct = readiness(r.id)*100;
    const b = state.roomBudgets[r.id] || 0, over = t.projected > b && b > 0;
    return `<button class="rcard" data-room="${r.id}">
      <div class="ring">${ring(pct, "var(--brand)")}</div>
      <div class="t">
        <h4>${esc(r.name)}</h4>
        <div class="foot">
          <span class="chipn"><i style="background:var(--d-buy)"></i>${t.nBuy} לקנות</span>
          <span class="chipn"><i style="background:var(--d-done)"></i>${t.nDone} נקנו</span>
          ${ t.projected||b ? `<span class="chipn" style="${over?"color:var(--d-buy)":""}">${moneyN(t.projected)}${ b? " / "+moneyN(b) : "" } ₪</span>` : "" }
        </div>
      </div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>`;
  }).join("");
  const addBtn = `<button class="addroom" id="addRoomBtn">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    הוספת חדר</button>`;
  $("#roomCards").innerHTML =
    (rows.length ? cards : `<p class="empty">אין חדרים בקטגוריה הזו.</p>`) +
    (roomFilter==="all" ? addBtn : "");
  $$("#roomCards .rcard").forEach(b=> b.addEventListener("click", ()=> openRoom(b.dataset.room)));
  const ab = $("#addRoomBtn"); if (ab) ab.addEventListener("click", addRoom);
}

/* ============================================================ MONEY */
function renderMoney(){
  const t = totals(state.items);
  const B = Math.max(state.budget, 1);
  const over = Math.max(0, t.projected - state.budget);
  const paidW = clamp(Math.min(t.paid, state.budget)/B*100, 0, 100);
  const planW = clamp(Math.min(Math.max(0, state.budget - t.paid), t.planned)/B*100, 0, 100);
  const overW = over>0 ? clamp(over/B*100, 0, 100) : 0;
  const left = state.budget - t.projected;

  $("#budgetHero").innerHTML = `
    <div class="bh-top">
      <div>
        <div class="bh-label">${left>=0 ? "נשאר בתקציב" : "חריגה מהתקציב"}</div>
        <div class="bh-big" style="${left<0?"color:var(--d-buy)":""}">${money(Math.abs(left))}</div>
      </div>
      <div class="bh-side">${money(t.projected)} / ${money(state.budget)}</div>
    </div>
    <div class="bh-bar">
      <i class="paid" style="width:${paidW}%"></i>
      <i class="plan" style="width:${planW}%"></i>
      ${overW? `<i class="over" style="width:${overW}%"></i>`:""}
    </div>
    <div class="bh-legend">
      <span><i style="background:var(--d-done)"></i>שולם ${money(t.paid)}</span>
      <span><i style="background:var(--coral)"></i>מתוכנן ${money(t.planned)}</span>
      ${over? `<span><i style="background:var(--d-buy)"></i>חריגה ${money(over)}</span>` : ""}
    </div>`;

  /* status rings — share of the home's total value (saved + projected) */
  const tv = Math.max(t.saved + t.projected, 1);
  const mr = (col, pct, label, amount)=>`
    <div class="mring"><div class="ring">${ring(pct, col)}</div>
      <div class="ml">${esc(label)}</div><div class="mv">${money(amount)}</div></div>`;
  $("#statusRings").innerHTML =
    mr("var(--d-done)", t.paid/tv*100,    "נקנה",  t.paid) +
    mr("var(--coral)",  t.planned/tv*100, "לקנות", t.planned) +
    mr("var(--d-home)", t.saved/tv*100,   "מהבית", t.saved);

  const scale = Math.max(...state.rooms.map(r=> Math.max(totals(roomItems(r.id)).projected, state.roomBudgets[r.id]||0)), 1) * 1.05;
  $("#roomRows").innerHTML = state.rooms.map(r=>{
    const rt = totals(roomItems(r.id)), b = state.roomBudgets[r.id]||0, diff = b - rt.projected;
    return `<div class="mrow" data-room="${r.id}">
      <div class="t">
        <div class="nm">${esc(r.name)}</div>
        <div class="track">
          <i class="paid" style="width:${rt.paid/scale*100}%"></i>
          <i class="plan" style="width:${rt.planned/scale*100}%"></i>
          ${ b>0 ? `<span class="bmark" style="inset-inline-start:${Math.min(b/scale*100,99)}%"></span>` : "" }
        </div>
      </div>
      <div class="amt">${moneyN(rt.projected)} ₪${ diff<0 ? `<small class="over">חריגה ${moneyN(-diff)}</small>` : (b?`<small>מתוך ${moneyN(b)}</small>`:"") }</div>
    </div>`;
  }).join("");
  $$("#roomRows .mrow").forEach(el=> el.addEventListener("click", ()=> openRoom(el.dataset.room)));
}

/* ============================================================ SHEET */
const sheet = ()=> $("#sheet"), scrim = ()=> $("#scrim");
function openSheet(){ sheet().classList.add("on"); scrim().classList.add("on"); }
function closeSheet(){ sheet().classList.remove("on"); scrim().classList.remove("on"); uiRoom = null; $("#shExtra").innerHTML = ""; }
function setHead(html){ $("#shT").innerHTML = html; }
function openRoom(id){ uiRoom = id; renderRoom(); openSheet(); }

function addRoom(){
  state.seq = (state.seq||0)+1;
  const id = "r"+state.seq+"_"+Date.now().toString(36);
  state.rooms.push({ id, name:"חדר חדש" });
  state.roomBudgets[id] = 0;
  save(); renderAll(); openRoom(id);
  setTimeout(()=>{ const n = $("#shName"); if (n){ n.focus(); n.select(); } }, 90);
}

let roomDelArmed = false, roomDelTimer;
function renderRoom(){
  if (!uiRoom) return;
  const r = roomById(uiRoom); if (!r) { closeSheet(); return; }
  const its = roomItems(uiRoom), t = totals(its);
  const b = state.roomBudgets[uiRoom] || 0, diff = b - t.projected;

  setHead(`<input class="sh-title-input" id="shName" value="${esc(r.name)}" aria-label="שם החדר" maxlength="40">
           <div class="sh-title-hint">לחיצה על השם עורכת אותו</div>`);
  $("#shExtra").innerHTML = `
    <div class="sh-stats">
      <div><div class="l">צפי הוצאה</div><div class="v">${money(t.projected)}</div></div>
      <div><div class="l">שולם</div><div class="v" style="color:var(--d-done)">${money(t.paid)}</div></div>
      <div><div class="l">נחסך מהבית</div><div class="v" style="color:var(--d-home)">${money(t.saved)}</div></div>
    </div>
    <div class="sh-budget">
      <label for="shBudget">תקציב לחדר</label>
      <input type="number" id="shBudget" min="0" step="500" value="${b}">
      <span class="n" style="color:${diff>=0?"var(--d-done)":"var(--d-buy)"}">${ diff>=0 ? "נשאר "+money(diff) : "חריגה "+money(-diff) }</span>
    </div>`;
  $("#shBody").innerHTML =
    (its.length ? its.map(itemHTML).join("") : `<p class="empty">אין עדיין פריטים בחדר הזה.</p>`) +
    `<button class="btn ghost block" id="shAdd" style="margin-top:16px">הוספת פריט לחדר</button>
     <button class="btn ghost block" id="shDelRoom" style="margin-top:9px;color:var(--d-buy)">מחיקת החדר כולו</button>`;

  $("#shName").addEventListener("change", e=>{ const r2=roomById(uiRoom); if(!r2) return;
    r2.name = e.target.value.trim() || "חדר"; save(); renderHeader(); renderRoomCards(); });
  $("#shBudget").addEventListener("change", e=>{ state.roomBudgets[uiRoom] = Math.max(0, +e.target.value||0); commit(); });
  $("#shAdd").addEventListener("click", ()=> addItemTo(uiRoom));

  roomDelArmed = false;
  $("#shDelRoom").addEventListener("click", e=>{
    const btn = e.currentTarget;
    if (!roomDelArmed){ roomDelArmed = true; btn.textContent = "לחץ שוב למחיקת החדר וכל הפריטים בו";
      clearTimeout(roomDelTimer); roomDelTimer = setTimeout(()=>{ roomDelArmed=false; if($("#shDelRoom")) $("#shDelRoom").textContent="מחיקת החדר כולו"; }, 5000); return; }
    clearTimeout(roomDelTimer);
    const id = uiRoom;
    state.items = state.items.filter(i=>i.room!==id);
    state.rooms = state.rooms.filter(r2=>r2.id!==id);
    delete state.roomBudgets[id];
    closeSheet(); commit(); toast("החדר נמחק");
  });
  wireItems();
}

function itemHTML(i){
  const delta = (i.status==="done" && i.actual!=null) ? i.actual - i.est : null;
  return `<div class="item is-${i.status}" data-id="${i.id}">
    <button class="tick" data-cycle aria-label="שינוי סטטוס">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </button>
    <div class="body">
      <input class="nm" value="${esc(i.name)}" data-f="name" aria-label="שם הפריט">
      <div class="sub">
        <span>הערכה <input class="price" type="number" min="0" step="50" value="${i.est}" data-f="est" aria-label="מחיר משוער"></span>
        ${ i.status==="done" ? `<span>בפועל <input class="price" type="number" min="0" step="50" value="${i.actual!=null?i.actual:""}" placeholder="—" data-f="actual" aria-label="מחיר בפועל"></span>` : "" }
        ${ delta!=null && delta!==0 ? `<span style="color:${delta>0?"var(--d-buy)":"var(--d-done)"};font-weight:700">${delta>0?"▲":"▼"} ${money(Math.abs(delta))}</span>` : "" }
      </div>
      <div class="seg" role="group" aria-label="סטטוס">
        ${Object.keys(STATUS).map(s=>`<button data-s="${s}" aria-pressed="${i.status===s}">${STATUS[s].short}</button>`).join("")}
      </div>
    </div>
    <button class="del" aria-label="מחיקת ${esc(i.name)}">×</button>
  </div>`;
}
function wireItems(){
  $$("#shBody .item").forEach(el=>{
    const id = el.dataset.id, it = state.items.find(x=>x.id===id);
    if (!it) return;
    $$("input[data-f]", el).forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const f = inp.dataset.f;
        if (f==="name")        it.name = inp.value.trim() || "פריט";
        else if (f==="actual") it.actual = inp.value==="" ? null : Math.max(0, +inp.value||0);
        else                   it.est = Math.max(0, +inp.value||0);
        commit();
      });
    });
    $$(".seg button", el).forEach(btn=> btn.addEventListener("click", ()=>{
      it.status = btn.dataset.s;
      if (it.status==="done" && it.actual==null) it.actual = it.est;
      commit();
    }));
    $("[data-cycle]", el).addEventListener("click", ()=>{
      it.status = it.status==="buy" ? "done" : (it.status==="done" ? "home" : "buy");
      if (it.status==="done" && it.actual==null) it.actual = it.est;
      commit();
    });
    $(".del", el).addEventListener("click", ()=>{ state.items = state.items.filter(x=>x.id!==id); commit(); toast("הפריט נמחק"); });
  });
}
function addItemTo(roomId){
  state.seq = (state.seq||0)+1;
  const fresh = { id:"i"+state.seq+"_"+Date.now().toString(36), room:roomId, name:"פריט חדש", est:0, actual:null, status:"buy" };
  state.items.push(fresh);
  if (uiRoom !== roomId) openRoom(roomId); else commit();
  setTimeout(()=>{ const rows = $$("#shBody .item"), last = rows[rows.length-1];
    if (last){ last.scrollIntoView({ block:"nearest" }); const n = $(".nm", last); n.focus(); n.select(); } }, 60);
}

/* ---- add-item sheet (FAB) ---- */
function openAddSheet(){
  uiRoom = null;
  setHead(`<h3>הוספת פריט</h3><div class="meta">בחר חדר והפריט ייפתח לעריכה</div>`);
  $("#shExtra").innerHTML = "";
  $("#shBody").innerHTML = `<div style="padding:4px 0 8px">${
    state.rooms.map(r=>`<button class="rcard" data-add="${r.id}" style="margin-bottom:10px;padding:14px 16px">
      <div class="t"><h4 style="font-size:15.5px;margin:0">${esc(r.name)}</h4>
      <div class="foot" style="margin-top:4px"><span style="font-size:12px;color:var(--muted);font-weight:500">${roomItems(r.id).length} פריטים</span></div></div>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>`).join("")
  }</div>`;
  $$("#shBody [data-add]").forEach(b=> b.addEventListener("click", ()=> addItemTo(b.dataset.add)));
  openSheet();
}

/* ---- settings sheet ---- */
function openSettings(){
  uiRoom = null;
  setHead(`<h3>הגדרות</h3><div class="meta">הנתונים נשמרים במכשיר הזה בלבד</div>`);
  $("#shExtra").innerHTML = "";
  $("#shBody").innerHTML = `
    <div class="settings-row"><span class="lbl">תאריך כניסה</span><input type="date" id="stMove" value="${state.moveIn}"></div>
    <div class="settings-row"><span class="lbl">תקציב כולל</span><input type="number" id="stBudget" min="0" step="1000" value="${state.budget}"></div>
    <p class="lede" style="margin:18px 0 10px">גיבוי שומר קובץ שאפשר לייבא בחזרה אם תחליף מכשיר או תנקה את הדפדפן.</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn ghost sm" id="stExport">גיבוי לקובץ</button>
      <button class="btn ghost sm" id="stImport">ייבוא מגיבוי</button>
      <button class="btn ghost sm" id="stReset" style="color:var(--d-buy)">איפוס לרשימה המקורית</button>
    </div>
    <input type="file" id="stFile" accept="application/json,.json" hidden>`;
  $("#stMove").addEventListener("change", e=>{ state.moveIn = e.target.value; commit(); renderHeader(); });
  $("#stBudget").addEventListener("change", e=>{ state.budget = Math.max(0, +e.target.value||0); commit(); });
  $("#stExport").addEventListener("click", async ()=>{
    const data = JSON.stringify(state, null, 2);
    if (window.claude && window.claude.downloads){
      try{ await window.claude.downloads.save({ filename:"הבית-החדש-גיבוי.json", data }); toast("הגיבוי נשמר"); return; }
      catch(err){ if (err && err.code === "declined"){ toast("הגיבוי בוטל"); return; } }
    }
    try{ await navigator.clipboard.writeText(data); toast("הגיבוי הועתק ללוח"); }catch(e){ toast("לא הצלחתי לשמור גיבוי"); }
  });
  $("#stImport").addEventListener("click", ()=> $("#stFile").click());
  $("#stFile").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{ try{ const s = JSON.parse(fr.result); if (!s || !Array.isArray(s.items)) throw 0;
      state = normalize(s); closeSheet(); commit(); toast("הגיבוי יובא"); }catch(err){ toast("הקובץ לא תקין"); } };
    fr.readAsText(f);
  });
  let armed = false, armTimer;
  $("#stReset").addEventListener("click", e=>{
    const btn = e.currentTarget;
    if (!armed){ armed = true; btn.textContent = "לחץ שוב לאישור";
      armTimer = setTimeout(()=>{ armed=false; btn.textContent="איפוס לרשימה המקורית"; }, 5000); return; }
    clearTimeout(armTimer); state = seedState(); closeSheet(); commit(); toast("הרשימה אופסה");
  });
  openSheet();
}

/* ============================================================ DRAG-TO-DISMISS */
(function dragSheet(){
  let startY=null, active=false;
  const el = ()=> sheet();
  function down(e){
    if (e.target.closest(".sh-close")) return;
    startY = (e.touches? e.touches[0].clientY : e.clientY); active=true;
    el().style.transition="none";
  }
  function move(e){
    if(!active) return;
    const y = (e.touches? e.touches[0].clientY : e.clientY);
    const dy = y - startY;
    if (dy>0){ el().style.transform=`translateY(${dy}px)`; scrim().style.opacity=String(clamp(1-dy/420,0,1)); if(e.cancelable) e.preventDefault(); }
  }
  function up(e){
    if(!active) return; active=false;
    const y = (e.changedTouches? e.changedTouches[0].clientY : e.clientY);
    const dy = y - startY;
    el().style.transition=""; scrim().style.opacity="";
    if (dy>96){ closeSheet(); }
    el().style.transform="";
  }
  const drag = $("#shDrag"), head = $("#shHead");
  [drag, head].forEach(n=>{
    n.addEventListener("pointerdown", down);
    n.addEventListener("touchstart", down, {passive:true});
  });
  window.addEventListener("pointermove", move, {passive:false});
  window.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("pointerup", up);
  window.addEventListener("touchend", up);
})();

/* ============================================================ RENDER + EVENTS */
function renderAll(){
  renderHeader(); renderHero(); renderRoomCards(); renderMoney();
  if (uiRoom) renderRoom();
}
$$(".tabbar [data-v]").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    uiView = btn.dataset.v;
    $$(".tabbar [data-v]").forEach(b=> b.setAttribute("aria-selected", String(b===btn)));
    $$(".view").forEach(v=> v.classList.toggle("on", v.id === "v-"+uiView));
    renderHeader(); window.scrollTo({ top:0, behavior:"smooth" });
  });
});
$$("#roomPills button").forEach(b=>{
  b.addEventListener("click", ()=>{
    roomFilter = b.dataset.f;
    $$("#roomPills button").forEach(x=> x.setAttribute("aria-selected", String(x===b)));
    renderRoomCards();
  });
});
$("#fab").addEventListener("click", ()=> uiRoom ? addItemTo(uiRoom) : openAddSheet());
$("#settingsBtn").addEventListener("click", openSettings);
$("#scrim").addEventListener("click", closeSheet);
$("#shClose").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if (e.key==="Escape") closeSheet(); });

const root = document.documentElement;
$("#themeBtn").addEventListener("click", ()=>{
  const cur = root.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur==="dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
  root.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
});
try{ const th = localStorage.getItem(THEME_KEY); if (th) root.setAttribute("data-theme", th); }catch(e){}

state = normalize(load());
renderAll();
save();
})();
</script>
</body>
